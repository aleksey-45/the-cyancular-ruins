<meta charset="UTF-8">

<title>The Cyancular Ruins — 关卡编辑器</title>
<style>
:root { --bg:#17191d; --panel:#1f2329; --panel2:#262b32; --border:#343b45;
        --text:#d7dde5; --dim:#8b94a1; --accent:#54a0ff; --warn:#e0b34a; --danger:#e06a5a; }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--text); font-size:13px;
       font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
       display:flex; flex-direction:column; overflow:hidden; }
button { background:var(--panel2); color:var(--text); border:1px solid var(--border);
         border-radius:4px; padding:5px 9px; font-size:13px; cursor:pointer; }
button:hover { border-color:var(--accent); }
button.on { border-color:var(--accent); background:#243040; }
input[type=number] { width:64px; background:var(--panel2); color:var(--text);
                     border:1px solid var(--border); border-radius:4px; padding:3px 6px; }
select { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:3px; }
#toolbar { display:flex; align-items:center; gap:6px; padding:6px 10px;
           background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
#toolbar .sep { width:1px; height:20px; background:var(--border); margin:0 4px; }
#toolbar label { color:var(--dim); }
#mid { flex:1; display:flex; min-height:0; }
#lib { width:200px; background:var(--panel); border-right:1px solid var(--border);
       display:flex; flex-direction:column; }
#lib h2 { font-size:13px; margin:8px 10px 4px; color:var(--accent); }
#lib-list { list-style:none; margin:0; padding:0 6px; overflow:auto; flex:1; }
#lib-list .lib-row { padding:4px 6px; border-radius:3px; cursor:pointer; color:var(--dim); }
#lib-list .lib-row:hover { background:var(--panel2); color:var(--text); }
#lib-btns { display:flex; flex-wrap:wrap; gap:4px; padding:6px; border-top:1px solid var(--border); }
#canvas-wrap { flex:1; min-width:0; position:relative; background:#0e1013; }
#map-canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
#right { width:240px; background:var(--panel); border-left:1px solid var(--border);
         overflow:auto; }
#right h2 { font-size:13px; margin:8px 10px 4px; color:var(--accent); }
.layer-row { display:flex; align-items:center; gap:6px; padding:3px 10px; cursor:pointer; }
.layer-row .name { flex:1; }
.layer-row.cur { background:var(--panel2); color:var(--accent); }
.layer-row button { padding:2px 6px; font-size:12px; }
#palette { display:flex; flex-wrap:wrap; gap:4px; padding:4px 10px; }
#palette .sw { width:26px; height:26px; border:1px solid var(--border); cursor:pointer;
               image-rendering:pixelated; }
#palette .sw.on { border-color:var(--accent); border-width:2px; }
.desc-row { display:flex; align-items:center; gap:6px; padding:2px 10px; color:var(--dim); }
.desc-row select { flex:1; }
#statusbar { display:flex; gap:14px; align-items:center; padding:4px 10px;
             background:var(--panel); border-top:1px solid var(--border); color:var(--dim); }
#status-msg { color:var(--warn); }
#boot-error { background:#3a2320; color:#ffd9d0; padding:8px 12px; border-bottom:1px solid var(--danger); }
</style>
</head>

// core/20_bytes.js —— 小端字节读写器与 CRC32。


// ── 字节读写器(一律小端)──
function ByteWriter(capacity) {
  this.buf = new Uint8Array(capacity || 256);
  this.len = 0;
}
ByteWriter.prototype._need = function (n) {
  if (this.len + n <= this.buf.length) return;
  var cap = this.buf.length;
  while (cap < this.len + n) cap *= 2;
  var nb = new Uint8Array(cap);
  nb.set(this.buf.subarray(0, this.len));
  this.buf = nb;
};
ByteWriter.prototype.u8 = function (v) {
  this._need(1); this.buf[this.len++] = v & 0xFF; return this;
};
ByteWriter.prototype.u16 = function (v) {
  this._need(2);
  this.buf[this.len++] = v & 0xFF;
  this.buf[this.len++] = (v >>> 8) & 0xFF;
  return this;
};
ByteWriter.prototype.u32 = function (v) {
  this._need(4);
  this.buf[this.len++] = v & 0xFF;
  this.buf[this.len++] = (v >>> 8) & 0xFF;
  this.buf[this.len++] = (v >>> 16) & 0xFF;
  this.buf[this.len++] = (v >>> 24) & 0xFF;
  return this;
};
ByteWriter.prototype.bytes = function (arr) {
  this._need(arr.length);
  this.buf.set(arr, this.len);
  this.len += arr.length;
  return this;
};
ByteWriter.prototype.finish = function () {
  return this.buf.slice(0, this.len);
};

function ByteReader(bytes) {
  this.b = bytes;
  this.p = 0;
}
ByteReader.prototype._need = function (n) {
  if (this.p + n > this.b.length) {
    throw new Error('ByteReader: 越界读(' + this.p + '+' + n + ' > ' + this.b.length + ')');
  }
};
ByteReader.prototype.u8 = function () {
  this._need(1); return this.b[this.p++];
};
ByteReader.prototype.u16 = function () {
  this._need(2);
  var v = this.b[this.p] | (this.b[this.p + 1] << 8);
  this.p += 2;
  return v >>> 0;
};
ByteReader.prototype.u32 = function () {
  this._need(4);
  var v = (this.b[this.p] | (this.b[this.p + 1] << 8) |
           (this.b[this.p + 2] << 16) | (this.b[this.p + 3] << 24)) >>> 0;
  this.p += 4;
  return v;
};
ByteReader.prototype.bytes = function (n) {
  this._need(n);
  var s = this.b.subarray(this.p, this.p + n);
  this.p += n;
  return s;
};
ByteReader.prototype.remaining = function () { return this.b.length - this.p; };

// ── CRC32(IEEE 802.3,多项式 0xEDB88320)──
const CRC_TABLE = (function () {
  var t = new Uint32Array(256);
  for (var n = 0; n < 256; n++) {
    var c = n;
    for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  var c = 0xFFFFFFFF;
  for (var i = 0; i < bytes.length; i++) {
    c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  }
  return (c ^ 0xFFFFFFFF) >>> 0;
}

// core/30_layers.js —— 单层编解码(纹理层 / 颜色层)。


const KIND_TEX = 1;
const KIND_COLOR = 2;

// ★ 索引 0 恒为空气:即使本层一个空气格都没有也要占住第 0 位,于是"空图 = 调色板 [0] + 全 0 索引流"无条件成立。
function encodeTexLayer(desc, subCols, subRows) {
  var n = subCols * subRows;
  if (desc.length !== n) {
    throw new Error('encodeTexLayer: desc 长度 ' + desc.length + ' ≠ subCols×subRows ' + n);
  }
  var pal = [DESC_AIR];
  var seen = new Map();
  seen.set(DESC_AIR, 0);
  var idx = new Uint32Array(n);
  for (var i = 0; i < n; i++) {
    var d = desc[i] >>> 0;
    var p = seen.get(d);
    if (p === undefined) {
      p = pal.length;
      // ★ 上界判在 push 之前且必须用 >=:此刻 p 是加入前的 pal.length,故合法条件是 p ≤ 65534(推导见 docs/eng/editor-core.md)。
      if (p >= 65535) throw new Error('encodeTexLayer: 调色板超过 65535 项(u16 上限)');
      pal.push(d);
      seen.set(d, p);
    }
    idx[i] = p;
  }
  var iw = pal.length <= 256 ? 1 : 2;
  var w = new ByteWriter(8 + pal.length * 4 + n * iw);
  w.u8(KIND_TEX);
  w.u16(pal.length);
  for (var k = 0; k < pal.length; k++) w.u32(pal[k]);
  w.u8(iw);
  if (iw === 1) { for (i = 0; i < n; i++) w.u8(idx[i]); }
  else { for (i = 0; i < n; i++) w.u16(idx[i]); }
  return w.finish();
}

function decodeTexLayer(r, subCols, subRows) {
  var kind = r.u8();
  if (kind !== KIND_TEX) throw new Error('decodeTexLayer: kind=' + kind + ',期望 ' + KIND_TEX);
  var palCount = r.u16();
  if (palCount === 0) throw new Error('decodeTexLayer: 调色板为空(索引 0 必须留给空气)');
  var pal = new Uint32Array(palCount);
  for (var k = 0; k < palCount; k++) pal[k] = r.u32();
  var iw = r.u8();
  if (iw !== 1 && iw !== 2) throw new Error('decodeTexLayer: index_width=' + iw + '(只允许 1 或 2)');
  var n = subCols * subRows;
  var desc = new Uint32Array(n);
  for (var i = 0; i < n; i++) {
    var p = iw === 1 ? r.u8() : r.u16();
    if (p >= palCount) throw new Error('decodeTexLayer: 索引 ' + p + ' 越出调色板 ' + palCount + ' 项');
    desc[i] = pal[p];
  }
  return { kind: 'tex', desc: desc };
}

// 背景层不做调色板:真彩,且平滑渐变恰好是 deflate 最擅长的一类数据(规格 §3.4)。
function encodeColorLayer(rgba, subCols, subRows) {
  var n = subCols * subRows;
  if (rgba.length !== n) {
    throw new Error('encodeColorLayer: rgba 长度 ' + rgba.length + ' ≠ subCols×subRows ' + n);
  }
  var w = new ByteWriter(5 + n * 4);
  w.u8(KIND_COLOR);
  for (var i = 0; i < n; i++) w.u32(rgba[i]);
  return w.finish();
}

function decodeColorLayer(r, subCols, subRows) {
  var kind = r.u8();
  if (kind !== KIND_COLOR) throw new Error('decodeColorLayer: kind=' + kind + ',期望 ' + KIND_COLOR);
  var n = subCols * subRows;
  var rgba = new Uint32Array(n);
  for (var i = 0; i < n; i++) rgba[i] = r.u32();
  return { kind: 'color', rgba: rgba };
}

// core/40_meta.js —— 元数据段(JSON)编解码。


// meta 文本形状与游戏侧 MapFormat.parse_spawn_metadata() 对齐:先注释、再出生点、最后敌人(规格 §3.2)。
function buildMeta(map) {
  var lines = [];
  var i;
  for (i = 0; i < map.comments.length; i++) lines.push('# ' + map.comments[i]);
  for (i = 0; i < map.players.length; i++) {
    var kw = i === 0 ? 'player' : (i === 1 ? 'player2' : 'player' + (i + 1));
    lines.push('# ' + kw + ' ' + map.players[i].x + ' ' + map.players[i].y);
  }
  for (i = 0; i < map.enemies.length; i++) {
    var e = map.enemies[i];
    lines.push('# enemy ' + e.type + ' ' + e.x + ' ' + e.y);
  }
  return lines.length ? lines.join('\n') + '\n' : '';
}

function parseMeta(text) {
  // 整数字面量(允许前导正负号):不用 isFinite,因为 parseInt 的前缀截断不是 NaN(3.5 / 7abc / 1e3 都会被静默改写)。
  var INT_TOKEN = /^[+-]?\d+$/;
  var players = [], enemies = [], comments = [];
  var lines = String(text == null ? '' : text).split(/\r?\n/);
  for (var i = 0; i < lines.length; i++) {
    var s = lines[i].trim();
    if (s === '') continue;
    if (s.charAt(0) !== '#') { comments.push(s); continue; }
    var body = s.slice(1).trim();
    var parts = body.split(/\s+/);
    var head = parts[0];
    if (/^player\d*$/.test(head) && parts.length >= 3) {
      if (INT_TOKEN.test(parts[1]) && INT_TOKEN.test(parts[2])) {
        players.push({ x: parseInt(parts[1], 10), y: parseInt(parts[2], 10) });
        continue;
      }
    } else if (head === 'enemy' && parts.length >= 4) {
      if (INT_TOKEN.test(parts[2]) && INT_TOKEN.test(parts[3])) {
        enemies.push({ type: parts[1], x: parseInt(parts[2], 10), y: parseInt(parts[3], 10) });
        continue;
      }
    }
    comments.push(body);
  }
  return { players: players, enemies: enemies, comments: comments };
}

// core/50_compress.js —— zlib(deflate)进出,走运行时原生流。


// 走运行时原生 CompressionStream('deflate'):产出 zlib(RFC1950),与 Godot 侧 decompress(COMPRESSION_DEFLATE) 对应。
function deflateBytes(bytes) {
  // ★ 三个全局都要守(本函数与 inflateBytes 同理):new Response(...) 在缺 Response 的环境里同步抛,会逃出 promise 契约。
  if (typeof CompressionStream === 'undefined' || typeof Blob === 'undefined' ||
      typeof Response === 'undefined') {
    return Promise.reject(new Error(
      'deflateBytes: 本环境没有 CompressionStream/Blob/Response;请用 encodeMap(map, {compress:false}) 导出裸 body'));
  }
  var stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'));
  return new Response(stream).arrayBuffer().then(function (buf) { return new Uint8Array(buf); });
}
// 流式解压,累计输出超过 maxBytes 就中止并拒绝(maxBytes 缺省 = 不设限;唯一调用方 decodeMap 传的是头部声明的 body_size)。
// ★ 上界必须作用在实际输出上:body_size 本身攻击者可控(谎报 4096 + 真炸弹),判在解压之后内存已经花掉(推导见 docs/eng/editor-core.md)。
function inflateBytes(bytes, maxBytes) {
  if (typeof DecompressionStream === 'undefined' || typeof Blob === 'undefined' ||
      typeof Response === 'undefined') {
    return Promise.reject(new Error('inflateBytes: 本环境没有 DecompressionStream/Blob/Response'));
  }
  var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  if (maxBytes === undefined) {
    return new Response(stream).arrayBuffer().then(function (buf) { return new Uint8Array(buf); });
  }
  var reader = stream.getReader();
  var chunks = [];
  var total = 0;
  function pump() {
    return reader.read().then(function (res) {
      if (res.done) {
        var out = new Uint8Array(total);
        var off = 0;
        for (var i = 0; i < chunks.length; i++) { out.set(chunks[i], off); off += chunks[i].length; }
        return out;
      }
      var chunk = res.value || new Uint8Array(0);
      total += chunk.length;
      // ★ 判在 push 之前(超限块不留下);先抛再 cancel —— cancel 不 settle 会让这条路永不 settle ⇒ 假绿(实测见 docs/eng/editor-core.md)。
      if (total > maxBytes) {
        var err = new Error('inflateBytes: 解压输出超过 ' + maxBytes + ' 字节上限(已累计 ' +
                            total + ' 字节),中止');
        reader.cancel().catch(function () {});
        throw err;
      }
      chunks.push(chunk);
      return pump();
    });
  }
  return pump();
}

// core/60_codec.js —— v4 容器:头 + body_size 闸 + 分层读写。


const FORMAT_VERSION = 4;
const HEADER_SIZE = 20;
const MAGIC = [0x43, 0x59, 0x52, 0x4D];   // "CYRM"

// ★ MAX_BODY_SIZE 是解压后 body 的硬上限,专堵 deflate 炸弹(压缩比 ≈1032:1,几十 KB 解出 GB 级内存);
//   它完全不碰头部字段,所以「按 body 实际余量反推格数」那道检查对它天然无效。
//   它用在两道闸上、两道都不可省:decodeMap 的头部声明、inflateBytes 的 maxBytes(推导见 docs/eng/editor-core.md)。
const MAX_BODY_SIZE = 64 * 1024 * 1024;

function layerFlags(map) {
  var f = 0;
  for (var L = 0; L < LAYER_COUNT; L++) if (map.layers[L]) f |= (1 << L);
  return f;
}

function encodeBody(map) {
  var metaBytes = new TextEncoder().encode(buildMeta(map));
  if (metaBytes.length > 65535) throw new Error('encodeBody: meta 超过 65535 字节');
  var w = new ByteWriter(64 + metaBytes.length);
  w.u16(metaBytes.length);
  w.bytes(metaBytes);
  for (var L = 0; L < LAYER_COUNT; L++) {
    var layer = map.layers[L];
    if (!layer) continue;                        // 缺层不写块,由 layer_flags 表达
    w.bytes(layer.kind === 'tex'
      ? encodeTexLayer(layer.desc, map.subCols, map.subRows)
      : encodeColorLayer(layer.rgba, map.subCols, map.subRows));
  }
  return w.finish();
}

function decodeBody(body, subCols, subRows, flags) {
  var r = new ByteReader(body);
  var metaLen = r.u16();
  var meta = parseMeta(new TextDecoder().decode(r.bytes(metaLen)));
  var layers = [];
  var n = subCols * subRows;
  for (var L = 0; L < LAYER_COUNT; L++) {
    if (!(flags & (1 << L))) { layers.push(null); continue; }
    var kind = LAYER_KINDS[L];
    // ★ 头部的 sub_cols / sub_rows 未经验证(CRC 只覆盖 body),一枚翻错的头字节就能让格数到 ≈43 亿
    //   ⇒ 用本层剩余字节数反推粗筛上界,且必须判在 new Uint32Array(n) 之前(不需精确,只需不可能通过)。
    var room = r.remaining();
    var maxCells = kind === 'tex' ? room : ((room / 4) | 0);
    if (n > maxCells) {
      throw new Error('decodeBody: 图层 ' + L + '(' + kind + ')需要 ' + n + ' 个子格,但剩余 ' +
                      room + ' 字节最多只够 ' + maxCells + ' 个 —— 头部尺寸 ' +
                      subCols + '×' + subRows + ' 与 body 实际大小不符');
    }
    layers.push(kind === 'tex'
      ? decodeTexLayer(r, subCols, subRows)
      : decodeColorLayer(r, subCols, subRows));
  }
  if (r.remaining() !== 0) {
    throw new Error('decodeBody: 尾部还有 ' + r.remaining() + ' 字节未消费');
  }
  return {
    name: '', subCols: subCols, subRows: subRows, layers: layers,
    players: meta.players, enemies: meta.enemies, comments: meta.comments,
  };
}

function encodeMap(map, opts) {
  opts = opts || {};
  // ★ 导出前必须跑一遍 validateMap:decodeMap 在尺寸/图层长度上很严格,encodeMap 不校验就会产出坏文件。
  //   只拒 errors、不拒 warnings —— 规格 §4.7 明说校验只报告不阻止导出(拿 warnings 拦导出 = 把"只报告"变成"阻止")。
  var report = validateMap(map);
  if (report.errors.length) {
    return Promise.reject(new Error('encodeMap: 地图校验未通过 —— ' + report.errors.join(';')));
  }
  var body, payload, compression;
  try {
    body = encodeBody(map);
  } catch (e) {
    return Promise.reject(e);
  }

  var pre = compress ? deflateBytes(body) : Promise.resolve(body);
  return pre.then(function (p) {
    payload = p;
    compression = compress ? 1 : 0;
    var w = new ByteWriter(HEADER_SIZE + payload.length);
    w.u8(MAGIC[0]); w.u8(MAGIC[1]); w.u8(MAGIC[2]); w.u8(MAGIC[3]);
    w.u8(FORMAT_VERSION);
    w.u8(compression);
    w.u32(body.length);          // ★ 解压后的大小
    w.u32(crc32(body));
    w.u16(map.subCols);
    w.u16(map.subRows);
    w.u8(layerFlags(map));
    w.u8(0);
    w.bytes(payload);
    return w.finish();
  });

// body 长度精确、CRC 相符、body 全消费、索引与调色板边界、每层分配前的粗筛。
// ★ 它不保证:调色板[0] 是空气、纹理 0 与整体 0 一致、尺寸在上限内、坐标落在非实心格 —— 完整清单见 docs/eng/editor-core.md。

  return new Promise(function (resolve) { resolve(bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes)); })
    .then(function (b) {
      if (b.length < HEADER_SIZE) throw new Error('decodeMap: 文件只有 ' + b.length + ' 字节,小于头部 20 字节');
      var r = new ByteReader(b);
      if (r.u8() !== MAGIC[0] || r.u8() !== MAGIC[1] || r.u8() !== MAGIC[2] || r.u8() !== MAGIC[3]) {
        throw new Error('decodeMap: magic 不是 "CYRM"');
      }
      var version = r.u8();
      if (version !== FORMAT_VERSION) {
        throw new Error('decodeMap: 版本 ' + version + ',本编辑器只认 ' + FORMAT_VERSION);
      }

      var bodySize = r.u32();
      var expectCrc = r.u32();
      var subCols = r.u16(), subRows = r.u16();
      var flags = r.u8();
      // ★ reserved 字节与 layer_flags 的 bit4-7 一律读掉不判:这是有意的前向兼容(将来头部扩字段时老编辑器降级忽略),
      //   故不要加 reserved === 0 或 flags & 0xF0 === 0 的校验 —— 实测 0xAB / 0xFF 的头部今天都能正常解码。
      r.u8();

      //   零守卫(读源码比位置的「源码顺序」那组已随测试面削减删掉·2026-10-15):挪到解压之后
      //   不会变红,改这里只能靠人看。行为侧只剩"声明超限必须拒"那一条,它钉不住位置。
      if (bodySize > MAX_BODY_SIZE) {
        throw new Error('decodeMap: 头部声明的 body_size ' + bodySize +
                        ' 字节超过 64MB 上限(' + MAX_BODY_SIZE + ' 字节),拒绝解压');
      }
      if (subCols <= 0 || subRows <= 0) {
        throw new Error('decodeMap: 尺寸非法 ' + subCols + '×' + subRows);
      }
      if (subCols % SUB_PER_CELL !== 0 || subRows % SUB_PER_CELL !== 0) {
        throw new Error('decodeMap: 尺寸 ' + subCols + '×' + subRows + ' 不是 ' + SUB_PER_CELL + ' 的倍数');

// core/80_validate.js —— 尺寸钳制与整图校验。


// ── 尺寸上限(规格 §4.3 闸 1)──
// 旧编辑器的 clampMin(v, min, def) 第三参是"非数字时的默认值"而不是上限,
// 输 99999 就会去分配一张巨图然后卡死浏览器。这里给硬上限。
const MAX_CELLS_W = 400;
const MAX_CELLS_H = 300;
const DEFAULT_CELLS_W = 125, DEFAULT_CELLS_H = 75;

function clampMapSize(w, h) {
  var wi = parseInt(w, 10), hi = parseInt(h, 10);
  if (!isFinite(wi)) wi = DEFAULT_CELLS_W;
  if (!isFinite(hi)) hi = DEFAULT_CELLS_H;
  return {
    w: Math.max(1, Math.min(MAX_CELLS_W, wi)),
    h: Math.max(1, Math.min(MAX_CELLS_H, hi)),
  };
}

// ── 导出前校验(规格 §4.7)──
// 只报告,不阻止导出 —— 编辑器不该替用户做决定。
// errors   = 真正非法,导出会产出坏文件
// warnings = 能导出,但游戏里大概不按你预期跑
function validateMap(map) {
  var errors = [], warnings = [];
  if (!map || !map.layers || map.layers.length !== LAYER_COUNT) {
    errors.push('图层数不是 ' + LAYER_COUNT);
    return { errors: errors, warnings: warnings };
  }
  if (map.subCols % SUB_PER_CELL !== 0 || map.subRows % SUB_PER_CELL !== 0) {
    errors.push('尺寸 ' + map.subCols + '×' + map.subRows + ' 不是 ' + SUB_PER_CELL + ' 的倍数');
  }
  var n = map.subCols * map.subRows;
  var L, layer;
  for (L = 0; L < LAYER_COUNT; L++) {
    layer = map.layers[L];
    if (!layer) continue;
    var arr = layer.kind === 'tex' ? layer.desc : layer.rgba;
    if (!arr || arr.length !== n) {
      errors.push(LAYER_NAMES[L] + '层长度不是 ' + map.subCols + '×' + map.subRows);
    }

  if (errors.length) return { errors: errors, warnings: warnings };

  var cellsW = map.subCols / SUB_PER_CELL, cellsH = map.subRows / SUB_PER_CELL;
  var scene = map.layers[LAYER_SCENE] ? map.layers[LAYER_SCENE].desc : null;

  // 出生点
  if (map.players.length === 0) {
    warnings.push('一个出生点都没有');
  }
  if (map.players.length > 2) {
    warnings.push('有 ' + map.players.length + ' 个出生点,但游戏只认前两个' +
                  '(第 3 个及以后在 map_format.gd 里读不到)');
  }

  for (i = 0; i < map.players.length; i++) {

  }
  for (i = 0; i < map.enemies.length; i++) {
    warnings = warnings.concat(_checkSpawn(map.enemies[i], '敌人 ' + map.enemies[i].type,
                                          cellsW, cellsH, scene));
  }

  // 四层全空
  var allEmpty = true;
  for (L = 0; L < LAYER_COUNT && allEmpty; L++) {
    layer = map.layers[L];
    if (!layer) continue;
    var a = layer.kind === 'tex' ? layer.desc : layer.rgba;
    for (var k = 0; k < a.length; k++) if (a[k] !== 0) { allEmpty = false; break; }
  }
  if (allEmpty) warnings.push('四个图层全是空的');

  return { errors: errors, warnings: warnings };

// 越界 / 落在实心格。返回 warning 文案数组(可能为空)。
function _checkSpawn(pt, label, cellsW, cellsH, sceneDesc) {
  var out = [];
  if (pt.x < 0 || pt.y < 0 || pt.x >= cellsW || pt.y >= cellsH) {
    out.push(label + ' 坐标 (' + pt.x + ',' + pt.y + ') 越界(地图是 ' + cellsW + '×' + cellsH + ' 格)');
    return out;
  }
  if (!sceneDesc) return out;
  // 「场景」层该格 4×4 子格全非空才算实心
  var subCols = cellsW * SUB_PER_CELL;
  var solid = true;
  for (var dy = 0; dy < SUB_PER_CELL && solid; dy++) {
    for (var dx = 0; dx < SUB_PER_CELL; dx++) {
      if (sceneDesc[(pt.y * SUB_PER_CELL + dy) * subCols + (pt.x * SUB_PER_CELL + dx)] === 0) {
        solid = false; break;
      }
    }
  }
  if (solid) out.push(label + ' 落在实心格里(场景层该格被填满)');
  return out;
}

// core/85_geometry.js —— 名字净化与画笔几何。


function sanitizeName(name) {
  var n = String(name == null ? '' : name).trim();
  n = n.replace(/\s+/g, '_');
  n = n.replace(/[^A-Za-z0-9_一-龥-]/g, '');
  n = n.replace(/^-+/, '');
  if (n.length > 32) n = n.slice(0, 32);
  return n === '' ? 'structure' : n;
}

// 画笔块偏移:以指针格为中心向上下/左右扩展,保证 lo+1+hi===size;奇数对称,偶数偏下右(否则偶数会缩水一格)。
function brushOffsets(size) {
  return { lo: Math.floor((size - 1) / 2), hi: Math.ceil((size - 1) / 2) };
}

// Bresenham 直线路径格坐标(含两端)。
function lineCells(x0, y0, x1, y1) {
  var cells = [];
  var dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  var sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  var err = dx - dy;
  var x = x0, y = y0;
  for (;;) {
    cells.push([x, y]);
    if (x === x1 && y === y1) break;
    var e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
  return cells;
}

// 矩形区域归一化:任意两角点 → {x, y, w, h}(含两端)。
function normRegion(x0, y0, x1, y1) {
  return { x: Math.min(x0, x1), y: Math.min(y0, y1),
           w: Math.abs(x1 - x0) + 1, h: Math.abs(y1 - y0) + 1 };
}

// core/90_desc.js —— descriptor 位域(辅码)。


// 位域(规格 §2.3):hue/bright/sat/alpha 各 3 位(bit0-11),texture 位 12-23(1-4095,0=空气),bit24-31 保留 0;档位表见 docs/eng/editor-core.md。

const TEXTURE_MAX = 4095;
const HUE_NEUTRAL = 4, BRI_NEUTRAL = 4, SAT_NEUTRAL = 4, ALPHA_NEUTRAL = 7;

function packDesc(texture, hue, bright, sat, alpha) {
  texture = texture | 0;
  if (texture <= 0 || texture > TEXTURE_MAX) return DESC_AIR;
  return (((hue & 7)) |
          ((bright & 7) << 3) |
          ((sat & 7) << 6) |
          ((alpha & 7) << 9) |
          (texture << 12)) >>> 0;

function texOf(d)    { return (d >>> 12) & 0xFFF; }
function hueOf(d)    { return d & 7; }
function brightOf(d) { return (d >>> 3) & 7; }
function satOf(d)    { return (d >>> 6) & 7; }
function alphaOf(d)  { return (d >>> 9) & 7; }
// ★ isAir(d) 判的是整体等于 DESC_AIR(0),只对本编码器产出的数据可靠;读外来文件时唯一判据是 texOf(d) === 0(见 docs/eng/editor-core.md)。
function isAir(d)    { return d === DESC_AIR; }

  return packDesc(texture, HUE_NEUTRAL, BRI_NEUTRAL, SAT_NEUTRAL, ALPHA_NEUTRAL);  // 中性 = 完全按原图;alpha 的中性档是 7,其余三列是 4

<script>
/* == tint.js == */
// tint.js —— 辅码(descriptor)的像素数学 + tinted-tile 缓存(规格 §2.3 / §4.2 ④)。
// ★ 必须在 core/ 分片之后加载:中性行、象限数、位域取值全取自 globalThis.Core,不自己抄 —— 抄了会漂,
//   而漂的表现是"编辑器里调好的颜色进游戏就变样"(不报错,玩的时候才看出来)。
// ★ 像素数学必须与游戏侧 shader 逐像素一致:HSV 不是 HSL;色相按 (H-4)*15 偏移后取模 360;亮度与
//   饱和度是乘法,乘数 (k+6)/10(中性档 4 = ×1.0,别写成 (k-4)*0.1 —— 那是加法那一支);alpha 乘 A/7。
globalThis.Tint = (function () {
  'use strict';

  var Core = globalThis.Core;
  if (!Core) {
    throw new Error('tint.js: 必须先加载 core.js(本模块的档位常量全部取自 Core,不自己抄一份)');
  }

  // ── 档位表(规格 §2.3):下标就是档位 k ──
  var LEVELS = 8;
  var HUE_OFFSET_DEG = [-60, -45, -30, -15, 0, 15, 30, 45];      // = (k - 4) * 15
  var MUL = [0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3];             // = (k + 6) / 10
  var ALPHA_NUM = [0, 1, 2, 3, 4, 5, 6, 7];                       // a' = a * k / 7
  // ★ 中性档取自 Core,不写字面量 —— 这是"两边不许漂"的那一条。
  var NEUTRAL = {
    hue: Core.HUE_NEUTRAL, bri: Core.BRI_NEUTRAL,
    sat: Core.SAT_NEUTRAL, alpha: Core.ALPHA_NEUTRAL,
  };

  function hueOffsetOf(level) { return HUE_OFFSET_DEG[level & 7]; }
  function mulOf(level) { return MUL[level & 7]; }
  function alphaScaleOf(level) { return ALPHA_NUM[level & 7] / Core.ALPHA_NEUTRAL; }

  // ── HSV(标准定义,h ∈ [0,360),s/v ∈ [0,1]);必须是 HSV 不是 HSL —— 两者在同一 rgb 上给出不同的 s/v。
  function fposmod(a, n) { var r = a % n; return r < 0 ? r + n : r; }

  function rgbToHsv(r, g, b) {
    var max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    var h = 0;
    if (d !== 0) {
      if (max === r) h = 60 * fposmod((g - b) / d, 6);
      else if (max === g) h = 60 * ((b - r) / d + 2);
      else h = 60 * ((r - g) / d + 4);
    }
    return { h: fposmod(h, 360), s: max === 0 ? 0 : d / max, v: max };
  }

  function hsvToRgb(h, s, v) {
    h = fposmod(h, 360);
    var c = v * s;
    var x = c * (1 - Math.abs(fposmod(h / 60, 2) - 1));
    var m = v - c;
    var i = Math.floor(h / 60) % 6;
    var r1, g1, b1;
    if (i === 0) { r1 = c; g1 = x; b1 = 0; }
    else if (i === 1) { r1 = x; g1 = c; b1 = 0; }
    else if (i === 2) { r1 = 0; g1 = c; b1 = x; }
    else if (i === 3) { r1 = 0; g1 = x; b1 = c; }
    else if (i === 4) { r1 = x; g1 = 0; b1 = c; }
    else { r1 = c; g1 = 0; b1 = x; }
    return { r: r1 + m, g: g1 + m, b: b1 + m };
  }

  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

  // ★ tintRGBA 是与游戏 shader 对齐的规范定义,浮点进浮点出;8 位取整只是它的落地实现。
  function tintRGBA(r, g, b, a, desc) {
    var hsv = rgbToHsv(r, g, b);
    var h2 = fposmod(hsv.h + hueOffsetOf(Core.hueOf(desc)), 360);
    var s2 = clamp01(hsv.s * mulOf(Core.satOf(desc)));
    var v2 = clamp01(hsv.v * mulOf(Core.brightOf(desc)));
    var rgb = hsvToRgb(h2, s2, v2);
    return { r: rgb.r, g: rgb.g, b: rgb.b, a: a * alphaScaleOf(Core.alphaOf(desc)) };
  }

  // 8 位通道的取整规则只有这一处:round(clamp01(x) * 255)。
  function toByte(x) {
    var v = Math.round(clamp01(x) * 255);
    return v < 0 ? 0 : (v > 255 ? 255 : v);
  }
  function tintBytes(r, g, b, a, desc) {
    var o = tintRGBA(r / 255, g / 255, b / 255, a / 255, desc);
    return [toByte(o.r), toByte(o.g), toByte(o.b), toByte(o.a)];
  }

  // ── 贴图几何:structure.png 320×320、每块 32×32;象限由 core/ 分片的 subcellRender 给出。
  var BLOCK_PX = 32;
  var QUAD_PX = 32 / Core.SUB_PER_CELL;     // 8
  var TILE_PX = Core.SUB_PX;                // 16 = 象限 8px 放大 2×,正好一个子格

  // ★★ 键与像素数学必须用同一个象限约定(quadIndex):两条约定并存时,负坐标会先造出一张错图再存进
  //    别的键,之后那个键直接命中错图。越界坐标当场抛,回绕由调用方自己先做;实测见 docs/eng/editor-io.md。
  var SUB = Core.SUB_PER_CELL;
  function quadIndex(q, which) {
    if (typeof q !== 'number' || !isFinite(q) || Math.floor(q) !== q || q < 0 || q >= SUB) {
      throw new Error('象限坐标 ' + which + ' = ' + q + ' 非法(合法范围 0..' + (SUB - 1) +
                      ';环面回绕请调用方先自己 ' + which + ' % ' + SUB + ')');
    }
    return q % SUB;
  }

  function textureBlockRect(texture, atlasWidth) {
    var cols = Math.floor(atlasWidth / BLOCK_PX);
    var i = (texture | 0) - 1;
    if (cols <= 0 || i < 0) {
      throw new Error('textureBlockRect: 纹理号 ' + texture + ' 或图集宽度 ' + atlasWidth + ' 非法');
    }
    return { x: (i % cols) * BLOCK_PX, y: Math.floor(i / cols) * BLOCK_PX, w: BLOCK_PX, h: BLOCK_PX };
  }

  // 纯像素:从图集取纹理 T 的第 (qx,qy) 个 8px 象限,按描述符 tint 后最近邻放大 2× 成 16×16
  // (插值会糊,与项目其余 texture_filter=nearest 的口径一致);返回 Uint8ClampedArray(16*16*4)。
  // ★★ 调用方契约(会抛):desc 为 0 的空气格没有贴图、纹理号超出图集行/列、纹理实参与 Core.texOf(desc)
  //    不一致、象限坐标不是 0..SUB_PER_CELL-1 的整数 —— 渲染循环必须先跳过 desc === 0,否则每帧都抛。
  function buildTilePixels(atlas, atlasWidth, texture, qx, qy, desc) {
    if (Core.texOf(desc) === 0) {
      throw new Error('buildTilePixels: 空气格没有贴图(desc=0x' + (desc >>> 0).toString(16) + ')');
    }
    var rect = textureBlockRect(texture, atlasWidth);
    var srcX = rect.x + quadIndex(qx, 'qx') * QUAD_PX;
    var srcY = rect.y + quadIndex(qy, 'qy') * QUAD_PX;
    var rows = atlas.length / (atlasWidth * 4);
    if (srcX + QUAD_PX > atlasWidth || srcY + QUAD_PX > rows) {
      throw new Error('buildTilePixels: 图集里没有纹理 ' + texture + ' 的象限 (' + qx + ',' + qy +
                      ') —— 图集是 ' + atlasWidth + '×' + rows);
    }
    // ★ 实参 texture 必须就是描述符里那个:不一致时上面两条都拦不住(那块在坐标系里是存在的),
    //   于是不声不响地画出另一块砖的像素,故与 desc=0 同级、当场抛。
    if (Core.texOf(desc) !== texture) {
      throw new Error('buildTilePixels: 纹理实参 ' + texture + ' 与描述符里的纹理 ' +
                      Core.texOf(desc) + ' 不一致(desc=0x' + (desc >>> 0).toString(16) + ')');
    }
    var scale = TILE_PX / QUAD_PX;
    var out = new Uint8ClampedArray(TILE_PX * TILE_PX * 4);
    for (var y = 0; y < QUAD_PX; y++) {
      for (var x = 0; x < QUAD_PX; x++) {
        var si = ((srcY + y) * atlasWidth + (srcX + x)) * 4;
        var p = tintBytes(atlas[si], atlas[si + 1], atlas[si + 2], atlas[si + 3], desc);
        for (var dy = 0; dy < scale; dy++) {
          for (var dx = 0; dx < scale; dx++) {
            var oi = ((y * scale + dy) * TILE_PX + (x * scale + dx)) * 4;
            out[oi] = p[0]; out[oi + 1] = p[1]; out[oi + 2] = p[2]; out[oi + 3] = p[3];
          }
        }
      }
    }
    return out;
  }

  // ── tinted-tile 缓存(规格 §4.2 ④):键 = (纹理, 象限, 描述符) → 一张 16×16 小图;同一块会被画
  //    成千上万次,故必须缓存。★ 画布是注入的(node 里没有 document),于是键 / 淘汰 / 失效都能断言。
  var DEFAULT_BACKEND = {
    createTile: function (pixels, size) {
      if (typeof document === 'undefined') {
        throw new Error('Tint: 本环境没有 document,请给 createTileCache 传 backend(node 测试用)');
      }
      var c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      var ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;       // 最近邻,与项目其余部分一致
      ctx.putImageData(new ImageData(pixels, size, size), 0, 0);
      return c;
    },
  };

  function createTileCache(opts) {
    opts = opts || {};
    var maxSize = opts.maxSize === undefined ? DEFAULT_MAX_TILES : opts.maxSize;
    var backend = opts.backend || DEFAULT_BACKEND;
    // ★ Map 的插入序就是 LRU 序:命中时 delete + set 把条目提到末尾,淘汰时取 keys().next().value 那个。
    var tiles = new Map();
    var atlas = null, atlasWidth = 0;
    var hits = 0, misses = 0, evictions = 0;

    // ★★ 换图必须整片失效:资源换了就是换了,没有"部分还新鲜"这回事(旧编辑器的纯色兜底永不失效 ⇒ 地图全是色块)。
    // ★★ setSource 契约:必须传平坦的 RGBA 数组(浏览器里就是 imageData.data),不是 ImageData 对象。
    function setSource(data, width) {
      // ★★ 传 ImageData 对象时 atlas.length 是 undefined ⇒ rows = NaN ⇒ 边界比较恒为假 ⇒ 一路产出
      //    全透明小图且不报错。守卫只做在参数形状上;像素数学里的抛错是"编程错误"哨兵,别动它。
      if (!data || typeof data.length !== 'number' || !isFinite(data.length) || data.length <= 0) {
        throw new Error('setSource: data 必须是平坦的 RGBA 数组(ImageData 的话请传它的 .data),实得 ' +
                        (data === null || data === undefined ? String(data) : typeof data) +
                        (data && typeof data.length === 'number' ? '(length=' + data.length + ')' : ''));
      }
      var w = width | 0;
      // 每像素 4 字节 ⇒ 宽度必须是 4 的倍数,且总字节数必须是整行的整数倍(否则宽度与数据对不上)。
      if (w <= 0 || w % 4 !== 0) {
        throw new Error('setSource: 图集宽度必须是正的、4 的倍数(每像素 4 字节),实得 ' + width);
      }
      if (data.length % (w * 4) !== 0) {
        throw new Error('setSource: 图集字节数 ' + data.length + ' 不是整行(' + w + '×4 = ' + (w * 4) +
                        ' 字节)的整数倍 —— 宽度与数据对不上');
      }
      atlas = data;
      atlasWidth = w;
      tiles.clear();
    }
    function tileKey(texture, qx, qy, desc) {
      return texture + '/' + quadIndex(qx, 'qx') + '/' + quadIndex(qy, 'qy') + '/' + (desc >>> 0);
    }
    // ★ 本函数会抛:空气格与越界纹理/象限的判定全在 buildTilePixels(那四种实参见它的契约)。
    function get(texture, qx, qy, desc) {
      var k = tileKey(texture, qx, qy, desc);
      // ★★ 命中判据必须是 tiles.has(k),不能写成 tiles.get(k) !== undefined:backend 若返回 undefined,
      //    后者恒为假 ⇒ 那张图永不命中,却已经占着槽位、还算进 size(实测读数见 docs/eng/editor-io.md)。
      if (tiles.has(k)) {
        var hit = tiles.get(k);
        hits++;
        tiles.delete(k);
        tiles.set(k, hit);                     // 提到最近使用端
        return hit;
      }
      misses++;
      if (!atlas) throw new Error('Tint: 还没 setSource,拿不到贴图(别在图片加载完成前画)');
      var tile = backend.createTile(buildTilePixels(atlas, atlasWidth, texture, qx, qy, desc), TILE_PX);
      if (maxSize > 0) {
        tiles.set(k, tile);
        while (tiles.size > maxSize) {
          tiles.delete(tiles.keys().next().value);
          evictions++;
        }
      }
      return tile;
    }
    function has(texture, qx, qy, desc) { return tiles.has(tileKey(texture, qx, qy, desc)); }
    function clear() { tiles.clear(); }
    function stats() {
      return { hits: hits, misses: misses, evictions: evictions, size: tiles.size, maxSize: maxSize };
    }
    return { setSource: setSource, get: get, has: has, clear: clear, stats: stats,
             tileKey: tileKey };
  }

  // 缓存上限:8192 × 16×16×4 字节 = 正好 8MB(规格 §4.3 闸 1)。
  var DEFAULT_MAX_TILES = 8192;

  return {
    LEVELS: LEVELS,
    HUE_OFFSET_DEG: HUE_OFFSET_DEG, MUL: MUL, ALPHA_NUM: ALPHA_NUM, NEUTRAL: NEUTRAL,
    hueOffsetOf: hueOffsetOf, mulOf: mulOf, alphaScaleOf: alphaScaleOf,
    fposmod: fposmod, rgbToHsv: rgbToHsv, hsvToRgb: hsvToRgb,
    tintRGBA: tintRGBA, tintBytes: tintBytes,
    BLOCK_PX: BLOCK_PX, QUAD_PX: QUAD_PX, TILE_PX: TILE_PX,
    textureBlockRect: textureBlockRect, buildTilePixels: buildTilePixels,
    DEFAULT_MAX_TILES: DEFAULT_MAX_TILES,
    DEFAULT_BACKEND: DEFAULT_BACKEND, createTileCache: createTileCache,
  };
})();
</script>

// render/00_head.js —— 'use strict' + 依赖守卫 + 缩放/预算常量;加载顺序 core → tile_defs → tint → render(见 editor.html),本层顶层一行都不碰 DOM。
'use strict';

var RenderCore = globalThis.Core, Tint = globalThis.Tint;   // ★ 不叫 Core:ui/00_head.js 的顶层 var Core 会被 hoist 成拼接后整段的局部名,各片加载期裸读它会拿到 undefined(parts_check 的"全局影子"闸);Tint 全仓只有这一处顶层声明,不存在这个遮蔽
if (!RenderCore) throw new Error('render.js: 必须先加载 core.js');
if (!Tint) throw new Error('render.js: 必须先加载 tint.js');

var SUB = RenderCore.SUB_PER_CELL;

var MIN_ZOOM = 1, MAX_ZOOM = 64;              // px / 子格
var ZOOM_THRESHOLD = 8;                       // 分工阈:< 8 走缩略图,≥ 8 走视口离屏层
var THUMB_PX = 2;                             // 缩略图 2px/子格
var THUMB_MAX_BYTES = 24 * 1024 * 1024;       // 超过就降到 1px/子格(400×300 格 @2px = 30MB,偏大)
var DEFAULT_BUDGET_MS = 8;                    // 闸 2 的单帧 CPU 预算
var DEFAULT_CELL_MAX = 8192;                  // ③ 的条目上限:8192 条 ≈ 1MB(条目只是 16 个 tile 引用,像素只存在 ④ 里,由它自己的上限管)

<script>
/* == render/10_torus_layers.js == */
// render/10_torus_layers.js —— 环面折算 wrapIdx/quadOf + 四层的格读取(缺席层 = 全空气)。

function wrapIdx(v, n) { return v - Math.floor(v / n) * n; }   // ★ 视图越过接缝、选区拖动、3×3 副本的 cx = -1 都会给出负数坐标,而 % 对负数返回负数
function quadOf(v) { return wrapIdx(v, SUB); }        // 恒在 0..SUB-1(否则 Tint 会抛)

// ★ layer_flags 允许某个层不存在 ⇒ map.layers[L] 可以是 null(全空气,不是"错误");直接摸它 .desc 会在打开缺层文件时当场炸。
function layerArray(map, L) {
  var lay = map.layers[L];
  if (!lay) return null;
  return lay.kind === 'tex' ? lay.desc : lay.rgba;
}
function descAt(map, L, X, Y) {
  var a = layerArray(map, L);
  if (!a) return 0;
  return a[wrapIdx(Y, map.subRows) * map.subCols + wrapIdx(X, map.subCols)];
}
function rgbaAt(map, X, Y) {
  var a = layerArray(map, RenderCore.LAYER_BG);
  if (!a) return 0;
  return a[wrapIdx(Y, map.subRows) * map.subCols + wrapIdx(X, map.subCols)];
}

<script>

// render/20_atlas.js —— 图集入口 setAtlas(①②③④ 四层一起作废)+ ④ 取小图 tileFor。

var atlasPixels = null, atlasW = 0, atlasH = 0;
var tiles = null;                              // ④:惰性建(见 tileCache())
var cells = null;                              // ③:由 attachCells 装上(mount 装它)

function tileCache() { if (!tiles) tiles = Tint.createTileCache(); return tiles; }
function attachCells(cache) { cells = cache; return cells; }   // ★ 显式接缝:③ 的作废必须由 setAtlas 触发,不能是"谁最后建的谁生效"
function cellCache() { return cells; }

// ★★ 换图必须让四层缓存一起作废(① 缩略图 / ② 视口离屏层 / ③ 格位图 / ④ 小图缓存):③ 靠 attachCells 交上来、④ 由 Tint.setSource 自清,
//    而 ①② 的 state 住在 mount 闭包里 ⇒ 挂载侧用 attachViewInvalidator 只登记、不回调一个作废器(setAtlas 提交完 ③④ 再调它);作废器只丢弃/记账,重绘留到下一次 render() 经 createSlicer 分帧。
var atlasInvalidators = [];
function attachViewInvalidator(fn) {
  if (typeof fn !== 'function' || atlasInvalidators.indexOf(fn) >= 0) return fn;
  atlasInvalidators.push(fn);
  return fn;
}

function setAtlas(pixels, w, h, opts) {
  var next = (opts && opts.backend) ? Tint.createTileCache({ backend: opts.backend })
                                    : (tiles || Tint.createTileCache());   // ★ 不走 tileCache():那个 getter 自己就会写 tiles,等于先换 ④ 再校验
  next.setSource(pixels, w);                   // ★ 形状非法就抛 —— 校验过了才提交,那之前 tiles/atlasPixels/③ 一个字都没动(注入 backend 时尤其要这样写,否则留下一个没有贴图源的新 ④)

// ★ 图纸容量 = 列 × 行(320×320 的图集 = 100 块),不是描述符位宽 4095。★ Math.max(0, …) 不是装饰:h 从来没被任何人校验过,负数 h 会算出负容量,而 clampTexture 把 < 1 的容量当"没有信息"静默放宽到 TEXTURE_MAX —— 负数于是伪装成"没信息"穿过那道闸。

  var tex = RenderCore.texOf(desc);            // ★ 纹理实参从 desc 推导(不另传):"实参与 texOf(desc) 不一致导致静默画另一块砖"从此不可能发生
  if (tex === 0) return null;                  // 畸形描述符(辅码非 0、纹理 0)= 空气
  return tileCache().get(tex, quadOf(qx), quadOf(qy), desc);
}

/* == render/30_cell_cache.js == */
// render/30_cell_cache.js —— ③ 格位图缓存:内容版本号(touch)与代际(setSource)两条失效轴。

function createCellCache(opts) {
  opts = opts || {};
  var maxCells = opts.maxCells === undefined ? DEFAULT_CELL_MAX : opts.maxCells;
  var build = opts.build;
  if (typeof build !== 'function') throw new Error('createCellCache: 缺 build 回调');
  var ver = new Map();                         // 内容版本号
  var entries = new Map();                     // 键 -> {v, gen, tile}
  var gen = 0, hits = 0, misses = 0, evictions = 0;

  function key(L, cx, cy) { return L + '/' + cx + '/' + cy; }
  function version(L, cx, cy) { var v = ver.get(key(L, cx, cy)); return v === undefined ? 0 : v; }
  function touch(L, cx, cy) { ver.set(key(L, cx, cy), version(L, cx, cy) + 1); }
  // ★★ 两条独立的失效轴必须都判:① 内容版本号(touch,编辑某格 +1 ⇒ 下次只重建这一格);② 代际(gen,setSource 递增 —— 换贴图源后即便内容一个字没改,旧 tile 也已作废)。
  //    只判 ① 会交出上一张图集算出来的 tile:整张图是色块、"有时好有时坏",不报错。
  // ★★ setSource 刻意不清表:陈旧条目靠 gen 不等恒 miss、被重建覆盖。清了表,get 里那句 e.gen === gen 就成了死代码,删掉 gen 比较再也杀不掉任何东西 —— 而它正是这条轴唯一抓得住的地方。
function setSource() { gen++; }
  function get(L, cx, cy) {
    var k = key(L, cx, cy);
    var v = version(L, cx, cy);
    var e = entries.get(k);
    if (e !== undefined && e.v === v && e.gen === gen) {
      hits++;
      entries.delete(k); entries.set(k, e);    // 命中提到最近端(Map 的插入序 = LRU 序)
      return e.tile;
    }
    misses++;
    var tile = build(L, cx, cy);
    // ★ 重建的键也要先 delete 再 set:Map.set 对已存在的键保留原来的插入位置,而这条路径恰恰常发生在"换图后 setSource 刻意不清表"留下的陈旧条目上 —— 不先删,刚重建出来的条目可能还蹲在最冷的位置,下一次淘汰就把它扔掉。
    entries.delete(k);
    entries.set(k, { v: v, gen: gen, tile: tile });
    while (entries.size > maxCells) { entries.delete(entries.keys().next().value); evictions++; }
    return tile;
  }
  function clear() { entries.clear(); }
  function stats() {
    return { hits: hits, misses: misses, evictions: evictions,
             size: entries.size, maxCells: maxCells, generation: gen };
  }
  return { version: version, touch: touch, setSource: setSource,
           get: get, clear: clear, stats: stats };
}

<script>
/* == render/40_slicer.js == */
// render/40_slicer.js —— 闸 2 单帧预算的时间切片器 createSlicer(分帧是"慢慢画出来",不是"页面死掉")。

function createSlicer(opts) {
  opts = opts || {};
  var raw = opts.budgetMs === undefined ? DEFAULT_BUDGET_MS : opts.budgetMs;
  // ★★ 预算必须是有限的数(now() - s0 >= NaN 恒为 false、负预算同理永远不成立 ⇒ while 一口气做完整批,而那正是闸 2 要防的,且不报错);「每帧至少做一项」也是必须的,否则 budgetMs = 0 时循环会一项不做就让出、让出之后又一项不做 —— 死循环(0 是合法的注入值,测试就在用它)。
  var budget = (typeof raw === 'number' && isFinite(raw)) ? Math.max(0, raw) : DEFAULT_BUDGET_MS;
  var now = opts.now || function () {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  };
  var nextFrame = opts.nextFrame || function () {
    return new Promise(function (r) { requestAnimationFrame(function () { r(); }); });
  };
  function run(items, fn) {
    var i = 0, frames = 0, maxStep = 0;
    return new Promise(function (resolve, reject) {
      // ★★ 抛错必须落到这个 promise 上:第 2 帧起 step 跑在 nextFrame().then(step) 这条没人观察的链上,裸抛会变成 unhandled rejection 而 run() 永远不 settle;
      //    第一帧抛却正常 reject(那时 step 还在 promise 执行器里同步跑)。两条路径症状不同,只测"第一帧抛"区分不了。
      function step() {
        try {
          var s0 = now();
          while (i < items.length) {
            fn(items[i], i); i++;
            if (now() - s0 >= budget) break;   // ★ 判在做完之后:预算是软的(到手一项就做完它),但一格都不许超
          }
          var d = now() - s0;
          if (d > maxStep) maxStep = d;
          if (i >= items.length) { resolve({ frames: frames, processed: i, maxStepMs: maxStep }); return; }
          frames++;                          // ★ 时间基准在让出之后重新取:让出一帧自己也花时间,把那段算进下一帧的预算会让"下一帧刚做一项就又超预算" —— 分帧退化成逐项让出
          // ★★ 第二个实参同样是承重的:它堵的是"让出的那一帧抛"(注入的 nextFrame() 交回 rejected promise)。只写 .then(step) 的话 step 一次都不会被调到,run() 的 promise 就悬在那里。
          nextFrame().then(step, reject);
        } catch (err) {
          reject(err);                           // ← 让第 2 帧起的抛错也 settle 掉 run()
        }
      }
      step();
    });
  }
  return { run: run, budgetMs: budget };
}
</script>
<script>
/* == render/50_view.js == */
// render/50_view.js —— 缩放/适配、可见区裁剪、环面 3×3 偏移与屏幕→子格命中。

function zoomPath(pxPerSub) { return pxPerSub < ZOOM_THRESHOLD ? 'thumb' : 'layers'; }
function clampZoom(z) {
  if (!isFinite(z) || z <= 0) return MIN_ZOOM;   // 用户输入钳制,不报错回滚
  return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z));
}
function fitZoom(subCols, subRows, viewW, viewH, pad) {
  var p = pad === undefined ? 8 : pad;
  var zx = (viewW - 2 * p) / subCols, zy = (viewH - 2 * p) / subRows;
  return clampZoom(Math.min(zx, zy));
}
function thumbScale(subCols, subRows) {
  var bytes = subCols * THUMB_PX * subRows * THUMB_PX * 4;
  return bytes > THUMB_MAX_BYTES ? 1 : THUMB_PX;
}

// ★ visibleSubRange 返回的是未折算的坐标(3×3 副本要的正是它):调用方按格自己 wrapIdx。
function visibleSubRange(view, viewW, viewH, subCols, subRows) {
  var x0 = Math.floor(view.x), y0 = Math.floor(view.y);
  var x1 = Math.ceil(view.x + viewW / view.zoom), y1 = Math.ceil(view.y + viewH / view.zoom);
  return { x0: x0, y0: y0, x1: x1, y1: y1 };
}

// ★ 环面 3×3 只返回"与视口相交"的那些副本偏移(最多 9 份,通常 1 份):无脑铺 9 份是 9 倍开销,而屏幕上绝大多数时候只看得到一份。
function intersects(a0, a1, b0, b1) { return a1 > b0 && a0 < b1; }
function torusOffsets(view, viewW, viewH, mapW, mapH) {
  var r = visibleSubRange(view, viewW, viewH, mapW, mapH);
  var out = [];
  for (var ky = -1; ky <= 1; ky++) {
    var lo = ky * mapH, hi = lo + mapH;
    if (!intersects(r.y0, r.y1, lo, hi)) continue;
    for (var kx = -1; kx <= 1; kx++) {
      var lox = kx * mapW, hix = lox + mapW;
      if (!intersects(r.x0, r.x1, lox, hix)) continue;
      out.push([lox, lo]);
    }
  }
  return out;
}

// 屏幕 → 子格(折算回主网格)。★ 副本上落笔靠的就是这一步:无论点在哪个副本上,结果都落在 [0, subCols) 里。
function hitTest(view, px, py, subCols, subRows) {
  var X = Math.floor(view.x + px / view.zoom);
  var Y = Math.floor(view.y + py / view.zoom);
  return { X: wrapIdx(X, subCols), Y: wrapIdx(Y, subRows) };
}

<script>
/* == render/60_brush.js == */
// render/60_brush.js —— 画笔几何:size → 格/子格跨度、region 与 snapHit 吸附。

var MAX_BRUSH_CELLS = 15;
function brushSpan(size) {
  var s = (typeof size === 'number' && isFinite(size)) ? size : 1;
  if (s <= 0) s = 1;
  if (Math.floor(s) === s) return { unit: 'cell', n: Math.max(1, Math.min(MAX_BRUSH_CELLS, s)) };
  var n = Math.round(s * SUB);                 // 0.25→1、0.5→2、0.75→3、2.5→10
  return { unit: 'sub', n: Math.max(1, Math.min(MAX_BRUSH_CELLS * SUB, n)) };
}
function brushRegion(hit, size) {
  var sp = brushSpan(size);
  var c = (typeof hit === 'object' && hit) ? hit : {};
  var x = Math.floor(isFinite(c.x) ? c.x : 0);
  var y = Math.floor(isFinite(c.y) ? c.y : 0);
  var lo = Math.floor((sp.n - 1) / 2), hi = Math.ceil((sp.n - 1) / 2);
  var unit = (c.kind === 'cell' || c.kind === 'sub') ? c.kind : sp.unit;   // ★★ unit 必须描述 x0..x1 所在的坐标空间(它们就是 hit 的空间,不是 size 那一侧):按 size 标注会让 regionCells 把子格坐标当成格号去 ×4
  return { unit: unit, x0: x - lo, y0: y - lo, x1: x + hi, y1: y + hi };
}
// ★★ 吸附 = 换算坐标空间,不只是贴个 kind 标签:hitTest 交出来的 X/Y 一直是子格号(与 kind 无关),所以 kind 'cell' 的命中必须 floor(X / SUB) 换成格号(与 UI 的 hitOf 同一条式子)。
//    两个分支只差一个标签的话,格空间的命中会把子格号当格号传下去,而下游(brushRegion 的 unit、regionCells)正是按 kind 决定要不要 ×4 —— 于是整支画笔偏到别处。
function snapHit(h) {
  if (h.kind === 'sub') return { kind: 'sub', x: Math.floor(h.X), y: Math.floor(h.Y) };
  return { kind: 'cell', x: Math.floor(h.X / SUB), y: Math.floor(h.Y / SUB) };
}
</script>
<script>
/* == render/65_selection.js == */
// render/65_selection.js —— 选区的环面成员判据、拖动偏移查询与规范块分解。

// ★★ selectionSource 的 W/H(= map.subCols/subRows)是可选的,给了就按环面折算(与 UI 的 idxOf / moveRegion 同一套 wrap)。
//    ★ 拖动查询必须给 —— 跨过接缝时目标格落在图的另一头(24 → 0),不折算的预览读到的是"目标格自己的内容",而松手 moveRegion 真搬过去的是源格的内容 ⇒ 预览 ≠ 落笔。
function selectionSource(sel, dx, dy, X, Y, W, H) {
  var sx = X - dx, sy = Y - dy;
  if (W > 0 && H > 0) { sx = wrapIdx(sx, W); sy = wrapIdx(sy, H); }   // 不给 = 不折算;5 实参的旧调用点都在主网格内,折算在那里是恒等
  if (inSel(sel, sx, sy, W, H)) return { hit: true, X: sx, Y: sy };
  return { hit: false, X: X, Y: Y };
}

// 选区在环面上的成员判据,而且是唯一一处 —— UI 的 inRect 直接转调它,故 regionCells 的 clip / 油漆桶 / 渐变 / 直线 / "按在选区里"五个调用点与这里的 moveRegion from 集合是同一条判据。
// ★ 公式:先各自折算到主网格再比相对偏移 —— 绝对比大小会在"选区自己跨着接缝"时静默漏掉绕过去的那半截(如 96 宽的图上 {x:93,w:6} 盖住 93..95 与 0..2)。
function inSel(sel, X, Y, W, H) {
  if (!sel) return false;
  if (!(W > 0 && H > 0)) {
    return X >= sel.x && X < sel.x + sel.w && Y >= sel.y && Y < sel.y + sel.h;
  }
  var ox = wrapIdx(wrapIdx(X, W) - wrapIdx(sel.x, W), W);
  var oy = wrapIdx(wrapIdx(Y, H) - wrapIdx(sel.y, H), H);
  return ox < sel.w && oy < sel.h;
}

function dedupRects(list) {                    // ★★ 必须有:去烤要把「当前偏移的源∪目标」与「上一次那两块」并起来重画,而选区没变时源块必然两组都有 ⇒ 不去重就把最大那块画两遍
  var out = [], seen = {};
  for (var i = 0; i < list.length; i++) {
    var r = list[i], key = r.x + ',' + r.y + ',' + r.w + ',' + r.h;   // 取四元组而非对象身份:两组矩形是各自 canonRects 算的,同一块在两边是两个不同对象
    if (seen[key]) continue;
    seen[key] = 1;
    out.push(r);
  }
  return out;
}

// ★ 一个矩形折算后至多 4 块:只取"左上角折算"会漏掉接缝另一头那半截(那半边的烤痕永远留着),取包围盒则会把整幅图都算进去。
function canonRects(r, W, H) {
  var out = [];
  if (!r || r.w <= 0 || r.h <= 0) return out;   // ★★ 只要求 w>0,不假设 x+w ≤ W:拖动会把折叠后的左上角与原始宽度一起存回来
  var x0 = wrapIdx(r.x, W), x1 = wrapIdx(r.x + r.w - 1, W);
  var y0 = wrapIdx(r.y, H), y1 = wrapIdx(r.y + r.h - 1, H);
  var xs = (x1 >= x0) ? [[x0, x1]] : [[x0, W - 1], [0, x1]];
  var ys = (y1 >= y0) ? [[y0, y1]] : [[y0, H - 1], [0, y1]];
  for (var i = 0; i < ys.length; i++) {
    for (var j = 0; j < xs.length; j++) {
      out.push({ x: xs[j][0], y: ys[i][0],
                 w: xs[j][1] - xs[j][0] + 1, h: ys[i][1] - ys[i][0] + 1 });
    }
  }
  return out;
}
</script>

/* == render/75_dirty.js == */
// render/75_dirty.js —— 脏区纯逻辑:矩形并/空判、脏集、平移边条、以光标为锚缩放。

function rectUnion(a, b) {
  if (!a) return { x: b.x, y: b.y, w: b.w, h: b.h };
  if (!b) return { x: a.x, y: a.y, w: a.w, h: a.h };

}
function rectIsEmpty(r) { return !r || r.w <= 0 || r.h <= 0; }

// ── ② 的脏区簿记(编辑 → 标脏;切层 → 只合成;平移 → 搬移 + 补边条)──
// ★ 跨层的脏矩形合成用一个包围盒就够:合成时按层拆是在 ② 的离屏层上做的,而"这一帧要不要重画"只需要一个上界(包围盒偏大只会多画一点,不会画错)。

function createDirtySet() {

  function addRect(r) { box = rectUnion(box, r); }
  function addCell(L, cx, cy) { addRect({ x: cx * SUB, y: cy * SUB, w: SUB, h: SUB }); }   // 格坐标(64px 格)→ 子格矩形
  return { addRect: addRect, addCell: addCell,

           clear: function () { box = null; } };
}

// ★ panStrips 的参数是视图/世界的位移方向(view.x 增加 dxPx/zoom):画面内容是反向走的,所以"向右看 10px"新露出来的是右边那 10px,调用方那里的自拷贝偏移是它的相反数。
function panStrips(w, h, dx, dy) {
  var out = [];
  if (dx === 0 && dy === 0) return out;
  if (Math.abs(dx) >= w || Math.abs(dy) >= h) return [{ x: 0, y: 0, w: w, h: h }];

<script>
/* == render/80_mount_state.js == */
// render/80_mount_state.js —— mount 的共享状态 S:安装器之间唯一的共享通道,安装期只登记不互调;换图时 ①② 的作废也由这里登记一个只记账的作废器。

// ★★ 契约:会被重新赋值的标量(thumbPx / atlasSync / errorSink / cellCache / layersClean)一律挂在这里、跨簇读写只能走 S.xxx,不许把它们当安装器的参数传 —— 函数在安装那一刻就捕获了一份旧值,之后别的簇重赋值它,读到的还是旧的。对象/数组(ctx / s / thumbs / layerCv / stat / stat2)的引用本身不会换,故各安装器开头就地取别名即可。
// ★★ ② 的像素坐标系定义(整个 ② 靠它):离屏层像素 (px,py) ↔ 世界子格 (view.x + px/zoom, view.y + py/zoom) —— 与屏幕同一套。
//    于是平移 = 像素级自拷贝搬移 + 只补新露出的边条,3×3 副本 = 把同一张图按「副本世界偏移 × zoom」平移后再画一次。★ 绝不建全图离屏:500×300 子格按 16px 是 8000×4800 = 153MB,浏览器会直接拒绝。
function createMountState(canvas, opts) {
  opts = opts || {};
  var ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;      // ★ 主 ctx 不关插值 ⇒ 放大后砖块是糊的(离屏层同此)
  var S = {
    canvas: canvas, opts: opts, ctx: ctx,
    s: {
      map: null, layer: RenderCore.LAYER_SCENE,
      view: { x: 0, y: 0, zoom: 8 },
      grid: true, subGrid: false, torus: true, dimOthers: true,
      layerVisible: [true, true, true, true],
      layerLocked: [false, false, false, false],
      selection: null,
      preview: null,       // 拖矩形/直线时的预览框(子格单位)
      selDrag: null,       // {sel, dx, dy}:选区拖动中(拖动只记偏移,松手才提交)
    },
    thumbs: [null, null, null, null],
    thumbPx: THUMB_PX,
    slicer: createSlicer(opts.slicer || {}),
    stat: { thumbMs: 0, renders: 0, lastRenderMs: 0, thumbsBuilt: 0 },
    atlasSync: false,                  // 换图之后 ①② 需要整片重来
    errorSink: null,                   // 由 installErrors 装上(默认 = defaultErrorSink)
    layerCv: [null, null, null, null],
    layerDirty: [null, null, null, null],      // 每层一个子格矩形(null = 干净)
    cellCache: null,                            // ③
    layersClean: false,                         // 四张离屏层是否与当前视图一致
    stat2: { cellsHits: 0, cellsMisses: 0, cellsSize: 0,
             layerRebuilds: 0, layerRebuildMs: 0, panCopies: 0 },   // ★ layerRebuilds = 脏区重画次数(块);layerRebuildMs = 一次整片 buildLayers 的耗时(毫秒)—— 名字相近,量的不是一件事
  };

  // ★★ 换图必须把 ①② 也一起作废:它们的 state 全住在这个闭包里(与 setMap 里 attachCells 完全同一个先例)⇒ 这里登记一个只记账的作废器,真正的丢弃与重画排在下一次 render()(见 syncAtlas);当场同步重画就等于把闸 2 取消了。
  attachViewInvalidator(function () { S.atlasSync = !!S.s.map; return null; });
  return S;
}
</script>
<script>
/* == render/82_install_errors.js == */
// render/82_install_errors.js —— 视图入口的报错通道:拒绝必须看得见,且不许吞掉返回的 promise。

function installErrors(S) {
  var opts = S.opts;
  // ★★ 视图入口(resize/fit/setView/setZoomAt/panBy/setMap/invalidateAll)返回的是由分帧器派生出来的 promise,而 ≥8 那条路上的抛错(tileFor 的"图集里没有纹理 N")发生在任务回调里
  //    ⇒ 它变成 run() 的拒绝,不再是 render() 里那次同步抛出:页面侧唯一的消费者(ui.js 的 guard)是同步 try/catch、接不住,而 render() 这一帧根本没执行 ⇒ 画布默默停在上一帧。这正是本仓最防的"按了没反应"。
  // ★★ 两条契约同时成立、缺一不可:① 想 await / 自己 catch 的调用方照样拿到那次拒绝(这里只挂观察者,不改、不吞、也不替换返回的 promise);② 完全不管返回值的调用方也能在屏幕上的同一条通道里看到原因。副作用正是要的:它把这条拒绝从全局 unhandledrejection 那张网里摘了出来。
  function msgOf(e) {                          // ★ 与 ui.js 的 msgOf 是同源重复(加载顺序让它没法共享):两处都只做"取出人能读的那句",改一处要同改另一处
    if (!e) return '未知错误';
    var m = (e.message !== undefined) ? String(e.message) : String(e);
    if (m === '' && e.cause && e.cause.message) m = String(e.cause.message);
    return m === '' ? String(e) : m;
  }
  function defaultErrorSink(text, err) {
    // ★ 走页面已经在用的那条通道:ui.js 的 status()(= 状态栏 #status-msg),运行时查找 —— 依赖顺序是 core → tint → render → io → ui,加载期顶层引 ui.js 会让 node 冒烟当场炸。
    var shown = false;
    try {
      var E = globalThis.Editor;
      if (E && typeof E.status === 'function') { E.status(text); shown = true; }
    } catch (e1) { shown = false; }
    if (!shown) {
      try {
        var el = (typeof document !== 'undefined' && document.getElementById)
          ? document.getElementById('status-msg') : null;
        if (el) { el.textContent = String(text); shown = true; }
      } catch (e2) { shown = false; }
    }
    if (typeof console !== 'undefined' && console.error) console.error(text, err);
  }
  S.errorSink = (typeof opts.onError === 'function') ? opts.onError : defaultErrorSink;
  function reportViewError(label, err) {
    var text = '出错了(' + label + '):' + msgOf(err);
    try { S.errorSink(text, err); }
    catch (e) {                                // ★ 报错通道自己坏了也不许把异常扔回调用方(那就成了第二处"看得见才怪")
      if (typeof console !== 'undefined' && console.error) console.error(text, e);
    }
  }
  function observed(label, p) {                // 给"会拒绝的入口"挂观察者,并原样返回那个 promise(见上面两条契约)
    if (p && typeof p.then === 'function') {
      p.then(null, function (e) { reportViewError(label, e); });
    }
    return p;
  }

  S.defaultErrorSink = defaultErrorSink;
  S.observed = observed;
}
</script>
<script>
/* == render/84_install_thumbs.js == */
// render/84_install_thumbs.js —— ① 缩略图簇:每层一张、按脏矩形更新、经分帧器建。

function installThumbs(S) {
  var s = S.s, thumbs = S.thumbs, stat = S.stat, slicer = S.slicer;
  function ensureThumbs(map) {
    var px = thumbScale(map.subCols, map.subRows);
    // ★★ 复用条件必须逐轴判(宽与高),只判宽度不够:thumbScale 只看总字节数,所以"同宽更高"的两张图可以拿到同一个刻度(500×300 与 500×400 子格都是 1000×600 与 1000×800,都是 2px),
    //    这时宽度那条对得上 ⇒ 复用了那张矮画布,而 drawThumbPath 用五实参 drawImage 把它整张缩进 subRows*px*scale 的目标框里 ⇒ 纵向被拉伸/截断。默认视图 fitZoom 之后 zoom < 8,走的正是这条路。
    if (thumbs[0] && S.thumbPx === px &&
        thumbs[0].width === map.subCols * px && thumbs[0].height === map.subRows * px) {
      // ★★ 复用尺寸相同的旧缩略图之前,先把新图里缺席的层清掉:缺席层不进 thumbTasks(省一次全图扫描)⇒ 它不会被重画,留着旧像素的话,
      //    换到一张少层的图之后那一层会继续显示上一张图的内容。只判"尺寸变了没"是抓不住的(尺寸一样 ⇒ 走的就是这条路)。
      for (var Lc = 0; Lc < RenderCore.LAYER_COUNT; Lc++) {
        if (thumbs[Lc] && !layerArray(map, Lc)) {
          thumbs[Lc].getContext('2d').clearRect(0, 0, thumbs[Lc].width, thumbs[Lc].height);
        }
      }
      return false;
    }
    S.thumbPx = px;
    for (var L = 0; L < RenderCore.LAYER_COUNT; L++) {
      thumbs[L] = document.createElement('canvas');
      thumbs[L].width = map.subCols * px;
      thumbs[L].height = map.subRows * px;
      var c = thumbs[L].getContext('2d');
      c.imageSmoothingEnabled = false;
    }
    return true;
  }

  // 画缩略图的一块矩形(单位 = 子格;rect 由调用方保证在图内)。逐子格 drawImage / fillRect 是这里唯一的成本(默认图 15 万次)⇒ 缩略图总是经分帧器建(闸 2)。
  // ★★ 先按层种类分派、再谈内容:RGBA 永远走不到 Core.texOf / Tint 那条路上(见 layerIsColor —— 这一句就是那个缺陷的闸门,不是装饰)。
  function paintThumbRect(L, rect) {
    var tc = thumbs[L] && thumbs[L].getContext('2d');
    if (!tc) return;
    var px = S.thumbPx;
    var colorLayer = layerIsColor(L);              // 判据取一次,不在逐格循环里重算
    for (var Y = rect.y; Y < rect.y + rect.h; Y++) {
      for (var X = rect.x; X < rect.x + rect.w; X++) {
        var q = S.dragSource(L, X, Y);                 // ★ 拖动中:读源子格(纯读;只对活动层)
        var raw = q.hit ? descAt(s.map, L, q.X, q.Y) : 0;
        if (colorLayer) {
          // ★ 这里不许出现 texOf:红色 #FF0000FF 的纹理位恰好是 0,拿 texOf 当"空气"判会把整层判没。alpha = 0(createMap 的初值)才是"这一格没有颜色"。
          if (((raw >>> 0) & 255) === 0) { tc.clearRect(X * px, Y * px, px, px); continue; }
          tc.fillStyle = cssOfRGBA(raw);
          tc.fillRect(X * px, Y * px, px, px);
          continue;
        }
        if (raw === 0 || RenderCore.texOf(raw) === 0) { tc.clearRect(X * px, Y * px, px, px); continue; }
        var t = tileFor(raw, X, Y);
        if (t) tc.drawImage(t, X * px, Y * px, px, px);
      }
    }
  }

  function thumbTasks(map) {                     // 把一整层的缩略图切成"每 8 行一组"的任务交给分帧器;缺席层不画(全空气)
    var tasks = [], rows = 8;
    for (var L = 0; L < RenderCore.LAYER_COUNT; L++) {
      if (!layerArray(map, L)) continue;
      for (var y = 0; y < map.subRows; y += rows) {
        tasks.push({ L: L, rect: { x: 0, y: y, w: map.subCols, h: Math.min(rows, map.subRows - y) } });
      }
    }
    return tasks;
  }

  function buildThumbs() {
    if (!s.map) return Promise.resolve();
    var t0 = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    var tasks = thumbTasks(s.map);
    stat.thumbsBuilt++;
    return slicer.run(tasks, function (t) { paintThumbRect(t.L, t.rect); }).then(function () {
      stat.thumbMs = (typeof performance !== 'undefined' ? performance.now() : Date.now()) - t0;
    });
  }

  function cssOfRGBA(v) {
    var u = v >>> 0;
    return 'rgba(' + ((u >>> 24) & 255) + ',' + ((u >>> 16) & 255) + ',' +
           ((u >>> 8) & 255) + ',' + ((u & 255) / 255) + ')';
  }
  function nowMs() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  }

  S.ensureThumbs = ensureThumbs;
  S.paintThumbRect = paintThumbRect;
  S.buildThumbs = buildThumbs;
  S.cssOfRGBA = cssOfRGBA;
  S.nowMs = nowMs;
}
</script>
<script>
/* == render/86_install_layer_path.js == */
// render/86_install_layer_path.js —— ② 视口离屏层簇:脏区重画、整片分帧重建、3×3 合成。

function installLayerPath(S) {
  var s = S.s, canvas = S.canvas, ctx = S.ctx;
  var layerCv = S.layerCv, layerDirty = S.layerDirty, slicer = S.slicer, stat2 = S.stat2;
  var layerGen = 0;                             // ★ 视图/图集/尺寸的代际:在飞的那一轮重建靠它作废
  // ★★ 视图一动,在飞的那一轮重建整个作废:条带矩形是按旧视图算的,而 paintLayerRect 又按当前视图换算像素 ⇒ 剩下的条带画到了别处。
  //    更糟的是它会与"自拷贝搬移"混在一起(搬移的前提是整张图属于同一次视图的产物),而脏标记此刻已经清干净了 ⇒ 纪律:视图不干净时平移一律改走整片重建(见 panBy 的第一条判据)。
  function viewChanged() { layerGen++; S.layersClean = false; }

  function ensureLayerCanvas(L) {
    if (layerCv[L] && layerCv[L].width === canvas.width && layerCv[L].height === canvas.height) return layerCv[L];
    var c = document.createElement('canvas');
    c.width = canvas.width; c.height = canvas.height;
    c.getContext('2d').imageSmoothingEnabled = false;   // ★ 离屏也必须关插值,否则放大后砖块是糊的
    layerCv[L] = c;
    layerDirty[L] = null;
    return c;
  }

  // ③ 的 build 回调:把一格的 16 个子格解析成 16 个 tile 引用(空气 → null);像素只存在 ④ 里,故 ③ 的条目极小。
  // ★★ 只有纹理层会走到这里 —— 颜色层的 16 个子格是 RGBA,由 paintLayerRect 的颜色分支直接取色;两者长得一模一样、含义完全不同,判据一律取 layerIsColor。
  function buildCell(L, cx, cy) {
    var out = new Array(SUB * SUB);
    var bx = cx * SUB, by = cy * SUB;
    for (var qy = 0; qy < SUB; qy++) {
      for (var qx = 0; qx < SUB; qx++) {
        var raw = descAt(s.map, L, bx + qx, by + qy);
        out[qy * SUB + qx] = (raw === 0 || RenderCore.texOf(raw) === 0) ? null : tileFor(raw, qx, qy);
      }
    }
    return out;
  }

  // 重画某一层的离屏上的一块矩形(单位 = 子格;矩形允许越出画布与主网格,内部裁剪)。
  // ★ 越出主网格是常态:离屏层的像素系与屏幕同一套,视图越过接缝时那半边像素只有靠折算后的格才填得上(descAt 本来就环面折算);绝不许按主网格裁剪 —— 裁了就是视图拖过边界时的一整条空白,而 3×3 副本填不上它(理由见 buildLayers)。
  function paintLayerRect(L, rect) {
    var cv = ensureLayerCanvas(L);
    var c = cv.getContext('2d');
    var z = s.view.zoom;
    var px0 = Math.max(0, Math.floor((rect.x - s.view.x) * z));            // 世界子格 → 画布局部像素
    var py0 = Math.max(0, Math.floor((rect.y - s.view.y) * z));
    var px1 = Math.min(cv.width, Math.ceil((rect.x + rect.w - s.view.x) * z));
    var py1 = Math.min(cv.height, Math.ceil((rect.y + rect.h - s.view.y) * z));
    if (px1 <= px0 || py1 <= py0) return;
    c.clearRect(px0, py0, px1 - px0, py1 - py0);
    if (!layerArray(s.map, L)) return;                 // 缺席层 = 全空气(已清干净)
    var cell0x = Math.floor((s.view.x + px0 / z) / SUB), cell1x = Math.ceil((s.view.x + px1 / z) / SUB);
    var cell0y = Math.floor((s.view.y + py0 / z) / SUB), cell1y = Math.ceil((s.view.y + py1 / z) / SUB);
    var colorLayer = layerIsColor(L);           // ★★ 按层种类分派(判据取一次,不在逐格循环里重算)—— 这就是那道闸门
    var cw = RenderCore.cellsWOf(s.map), ch = RenderCore.cellsHOf(s.map);
    for (var cy = cell0y; cy < cell1y; cy++) {
      for (var cx = cell0x; cx < cell1x; cx++) {
        var bx = cx * SUB, by = cy * SUB;
        if (colorLayer) {
          // 颜色层:逐子格读 RGBA、直接填色。alpha = 0 = 这一格没有颜色(上面已 clearRect,这里什么都不画)。★ 这里不许出现 texOf(见 buildCell 的两条静默症状)。
          for (var kc = 0; kc < SUB * SUB; kc++) {
            var Xc = bx + (kc % SUB), Yc = by + Math.floor(kc / SUB);
            var qc = S.dragSource(L, Xc, Yc);              // ★ 拖动中:读源子格(纯读;只对活动层)
            var rawc = qc.hit ? descAt(s.map, L, qc.X, qc.Y) : 0;
            if (((rawc >>> 0) & 255) === 0) continue;
            c.fillStyle = S.cssOfRGBA(rawc);
            c.fillRect((Xc - s.view.x) * z, (Yc - s.view.y) * z, z, z);
          }
          continue;
        }
        // ★ ③ 的键必须是主网格上的格号:环面让同一格有多种写法(cx = -1 与 cx = cellsW-1),不折算的话同一格会缓存两条条目,而编辑只 touch 其中一条 ⇒ 接缝另一侧的副本继续显示陈旧内容(画面错了、一个字都不报)。
        // ★★ 拖动偏移从这里接:拖动中读的是源格(纯读,不改进数据),画的位置仍是目标格(bx/by)—— 只有"读"是偏移过的;传进去的子格坐标取缓存键前再折回格号。
        var gx = wrapIdx(cx, cw), gy = wrapIdx(cy, ch);
        var q = S.dragSource(L, gx * SUB, gy * SUB);
        if (!q.hit) continue;                            // 被腾空的源区 ⇒ 这一格不画
        var tilesOfCell = S.cellCache.get(L, wrapIdx(Math.floor(q.X / SUB), cw),
                                           wrapIdx(Math.floor(q.Y / SUB), ch));  // ★ ③:这一格的 16 个 tile
        for (var k = 0; k < tilesOfCell.length; k++) {
          var t = tilesOfCell[k];
          if (!t) continue;
          var X = bx + (k % SUB), Y = by + Math.floor(k / SUB);   // ★ 画在目标格的位置
          c.drawImage(t, (X - s.view.x) * z, (Y - s.view.y) * z, z, z);
        }
      }
    }
  }

  // 重建所有"脏"的离屏层(编辑之后只重画脏矩形 ⇒ 成本 O(脏区),不是 O(全屏))。★ 隐藏层也照画:离屏内容与可见性无关,反过来会让"隐藏 → 编辑 → 显示"看到一片旧内容。
  function flushDirty() {
    for (var L = 0; L < RenderCore.LAYER_COUNT; L++) {
      if (!layerDirty[L]) continue;
      var d = layerDirty[L];
      layerDirty[L] = null;
      if (!layerArray(s.map, L)) { ensureLayerCanvas(L).getContext('2d').clearRect(0, 0, canvas.width, canvas.height); continue; }
      paintLayerRect(L, d);
      stat2.layerRebuilds++;
    }
  }

  // ★★ 全屏重建:重画的世界范围就是可见范围本身(visibleSubRange),不裁到主网格 —— 离屏层的像素系与屏幕同一套,可见范围里落在主网格之外的像素(视图越过接缝时必然出现)必须用折算后的格去填;裁了会留一整条空白,而 3×3 的副本填不上:副本的贴图偏移是「副本世界偏移 × zoom」,视口 12.5 格宽、地图 500 格时隔壁副本被平移 −8000px、整个落在画布外。
  function buildLayers() {
    if (!s.map) return Promise.resolve();
    // ★★ 入口就把 layersClean 放下:++layerGen 只作废在飞的那一轮,管不到"这一轮还没落地",而"还没落地"这段时间里离屏层是半旧的;本方法是公开入口(见文件尾的导出表),调用方完全可能不先走 viewChanged() 就进来。
    S.layersClean = false;
    var myGen = ++layerGen;
    var r = visibleSubRange(s.view, canvas.width, canvas.height, s.map.subCols, s.map.subRows);
    var tasks = [];
    var bands = 16;
    var h = Math.max(1, Math.ceil((r.y1 - r.y0) / bands));
    for (var L = 0; L < RenderCore.LAYER_COUNT; L++) {
      layerDirty[L] = null;
      ensureLayerCanvas(L);
      for (var y = r.y0; y < r.y1; y += h) {
        tasks.push({ L: L, rect: { x: r.x0, y: y, w: r.x1 - r.x0, h: Math.min(h, r.y1 - y) } });
      }
    }
    var t0 = S.nowMs();
    return slicer.run(tasks, function (t) {
      if (myGen !== layerGen) return;              // ★ 过期的一轮:整条作废(视图/尺寸/图集已变)
      paintLayerRect(t.L, t.rect);
    }).then(function () {
      if (myGen !== layerGen) return;              // ★ 过期的一轮不许把 layersClean 抬起来
      stat2.layerRebuildMs = S.nowMs() - t0;
      S.layersClean = true;
    });
  }

  // ★★ 3×3 的合成:每份副本都是把同一张离屏层按「副本世界偏移 × zoom」平移后再画一次;偏移是 subCols/subRows 的整数倍,而 paintLayerRect 读格时本来就环面折算 ⇒ 每份副本在任意位置画出来的内容都等于该处应有的内容。
  // ★★ 但别把"多份副本"读成承重:离屏层的像素系 = 屏幕系,它上面已经按可见范围本身把每一处应有的内容都铺好了 —— 越出主网格的那些像素由 paintLayerRect 的环面折算补上。
  //    所以那几份副本画的是同一批像素、在当前坐标系下是冗余的;"屏幕每一处都有一份盖上去"这个保证来自 paintLayerRect 的折算,不是来自这里。留着它们的理由:环面 N×N 铺贴是刻意保留的交付面,且 setTorus 开关的可见行为就是它(render_smoke 相位 ⑩d 钉住的 [8,4]);真要省这几笔,把 offs 收成 [[0,0]] 即可(⑩d 的期望值要同改)—— 那是省冗余,不是拆保证。
  function drawLayerPath(W, H) {
    flushDirty();
    var offs = S.torusList(W, H);
    var z = s.view.zoom;
    for (var oi = 0; oi < DRAW_ORDER.length; oi++) {
      var L = DRAW_ORDER[oi];
      if (!s.layerVisible[L] || !layerCv[L]) continue;
      // ★ 尺寸对不上的离屏层(改窗口之后、重建还没跑到)一路都不许画:它的像素刻度属于上一块画布,画出去是"整层错位",而空白会被下一次重建补上(resize 已经把它丢掉)。
      if (layerCv[L].width !== W || layerCv[L].height !== H) continue;
      ctx.globalAlpha = (s.dimOthers && L !== s.layer && L !== RenderCore.LAYER_BG) ? 0.4 : 1;
      for (var i = 0; i < offs.length; i++) {
        ctx.drawImage(layerCv[L], offs[i][0] * z, offs[i][1] * z);
      }
    }
    ctx.globalAlpha = 1;                         // ★ 切层 ≠ 重画:压暗/可见性只在合成这一层做(4 次 drawImage),不碰任何一层的离屏内容
  }

  S.viewChanged = viewChanged;
  S.buildCell = buildCell;
  S.paintLayerRect = paintLayerRect;
  S.buildLayers = buildLayers;
  S.drawLayerPath = drawLayerPath;
}
</script>
<script>
/* == render/88_install_draw.js == */
// render/88_install_draw.js —— 坐标换算、① 的合成路径、网格/覆盖层、唯一渲染入口与 resize/fit。
// ★ ② 那一簇(drawLayerPath / paintLayerRect / buildLayers)住在 86_install_layer_path.js。

function installDraw(S) {
  var s = S.s, canvas = S.canvas, ctx = S.ctx, thumbs = S.thumbs;
  var stat = S.stat, stat2 = S.stat2, layerCv = S.layerCv, layerDirty = S.layerDirty;
  function screenToSub(px, py) {
    // ★ 还没打开地图时返回中性值(闸 1:用户输入钳制,不报错回滚)—— 指针事件比 setMap 早到是完全可能的,而这里抛错只会表现为"点了没反应"。
    if (!s.map) return { X: 0, Y: 0 };
    return hitTest(s.view, px, py, s.map.subCols, s.map.subRows);
  }
  function subToScreen(X, Y) {
    return { x: (X - s.view.x) * s.view.zoom, y: (Y - s.view.y) * s.view.zoom };
  }

  // ★★ torusList 由本簇产出、被 86 的 drawLayerPath 经 S.torusList 晚绑定取用(首轮漏了它,render_smoke 当场红)。关掉环面时只画一份:副本本来就是冗余的,保证来自 paintLayerRect 的折算而不是它们。
  function torusList(W, H) {
    if (!s.torus) return [[0, 0]];
    return torusOffsets(s.view, W, H, s.map.subCols, s.map.subRows);
  }

  // 路径一:< 8 px/子格 走缩略图合成 —— 一次 drawImage 顶掉几十万次。
  function drawThumbPath(W, H) {
    var px = S.thumbPx;
    var scale = s.view.zoom / px;                  // 缩略图像素 → 屏幕像素
    var offs = torusList(W, H), i, L;
    for (i = 0; i < offs.length; i++) {
      for (var oi = 0; oi < DRAW_ORDER.length; oi++) {
        L = DRAW_ORDER[oi];
        if (!s.layerVisible[L] || !thumbs[L]) continue;
        ctx.globalAlpha = (s.dimOthers && L !== s.layer && L !== RenderCore.LAYER_BG) ? 0.4 : 1;
        ctx.drawImage(thumbs[L],
                      (offs[i][0] - s.view.x) * s.view.zoom,
                      (offs[i][1] - s.view.y) * s.view.zoom,
                      s.map.subCols * px * scale, s.map.subRows * px * scale);
      }
    }
    ctx.globalAlpha = 1;
  }

  // ★ 子格线只在 zoom ≥ 4 时画:阈值 4 是本文件自己的选择(4 px/子格时一个子格还有 4 个屏幕像素、线还分得开,再稀就只是给画面加噪点),不是规格里的数字。只画可见区(不裁剪 = 每次重画整张图的线)。
  function drawGrid(W, H) {
    var r = visibleSubRange(s.view, W, H, s.map.subCols, s.map.subRows);
    var z = s.view.zoom;
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.beginPath();
    if (s.subGrid && z >= 4) {
      for (var X = Math.floor(r.x0 / 1); X <= r.x1; X++) {
        var sx = Math.round((X - s.view.x) * z) + 0.5;
        if (sx < -1 || sx > W + 1) continue;
        ctx.moveTo(sx, 0); ctx.lineTo(sx, H);
      }
      for (var Y = r.y0; Y <= r.y1; Y++) {
        var sy = Math.round((Y - s.view.y) * z) + 0.5;
        if (sy < -1 || sy > H + 1) continue;
        ctx.moveTo(0, sy); ctx.lineTo(W, sy);
      }
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.30)';   // 格线(64px = 4 个子格)
    ctx.beginPath();
    for (var X2 = Math.floor(r.x0 / SUB) * SUB; X2 <= r.x1; X2 += SUB) {
      var sx2 = Math.round((X2 - s.view.x) * z) + 0.5;
      if (sx2 < -1 || sx2 > W + 1) continue;
      ctx.moveTo(sx2, 0); ctx.lineTo(sx2, H);
    }
    for (var Y2 = Math.floor(r.y0 / SUB) * SUB; Y2 <= r.y1; Y2 += SUB) {
      var sy2 = Math.round((Y2 - s.view.y) * z) + 0.5;
      if (sy2 < -1 || sy2 > H + 1) continue;
      ctx.moveTo(0, sy2); ctx.lineTo(W, sy2);
    }
    ctx.stroke();
  }

  // spawn 标记 + 选区框。★ 字体/对齐设一次(每标记重设 font 是排版最贵的一项)。
  function drawOverlay(W, H) {
    if (!s.map) return;
    ctx.save();
    ctx.font = '12px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var offs = torusList(W, H);
    var mark = function (cellX, cellY, color, label) {
      for (var i = 0; i < offs.length; i++) {
        var X = cellX * SUB - offs[i][0], Y = cellY * SUB - offs[i][1];
        var p = subToScreen(X, Y);
        if (p.x < -64 || p.y < -64 || p.x > W + 64 || p.y > H + 64) continue;
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.75;
        ctx.fillRect(p.x, p.y, 4 * s.view.zoom, 4 * s.view.zoom);
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#000';
        ctx.fillText(label, p.x + 2 * s.view.zoom, p.y + 2 * s.view.zoom);
      }
    };
    for (var i = 0; i < s.map.players.length; i++) {
      mark(s.map.players[i].x, s.map.players[i].y, '#54a0ff', 'P' + (i + 1));
    }
    for (var j = 0; j < s.map.enemies.length; j++) {
      mark(s.map.enemies[j].x, s.map.enemies[j].y, '#c96fb0', 'E');
    }
    if (s.preview) {
      var pv = subToScreen(s.preview.x, s.preview.y);
      ctx.setLineDash([6, 4]);
      ctx.strokeStyle = '#54a0ff';
      ctx.lineWidth = 1;
      ctx.strokeRect(pv.x, pv.y, s.preview.w * s.view.zoom, s.preview.h * s.view.zoom);
      ctx.setLineDash([]);
    }
    if (s.selection) {
      // ★ 拖动中框按偏移后的位置画(数据还没动 —— 松手才 moveRegion);这是拖动过程中唯一看得见的反馈,setSelDrag 只调 render()。
      // ★★ 末尾那句 || (s.selDrag ? s.selDrag.sel : null) 是防御性、今天不可达(外层判据就在上一行):放松外层会让选区为空时画出一个框,正是 render_smoke 相位 ⑬h 那条"选区为空时不画框"要禁止的,故它不是一条活路径。
      var base = s.selection || (s.selDrag ? s.selDrag.sel : null);
      var sel = (base && s.selDrag)
        ? { x: base.x + s.selDrag.dx, y: base.y + s.selDrag.dy, w: base.w, h: base.h }
        : base;
      if (sel) {
        var a = subToScreen(sel.x, sel.y);
        ctx.strokeStyle = '#e0b34a';
        ctx.lineWidth = 2;
        ctx.strokeRect(a.x, a.y, sel.w * s.view.zoom, sel.h * s.view.zoom);
      }
    }
    ctx.restore();
  }

  // ★ 唯一渲染入口:同一帧只许画一次画布。
  // ★★ 三条路径按 zoom 分工:① 缩略图(< 8)、② 视口离屏层(≥ 8);而合成那一步(层可见性/压暗/3×3 副本)两条路都走 ⇒ "切层"只是重新合成,永远不重画任何一层。
  // ★★ 换图之后的唯一收口也在这里:①② 的像素全是按旧图集算出来的,而它们只可能被这一条路合成到屏幕上 ⇒ 在唯一入口上作废既不会漏、也不会白付。★ 本帧不画:上一次的画面留在屏幕上,重建落地后由它自己的 .then(render) 画。
  function render() {
    if (!s.map) return;
    if (S.atlasSync) { S.syncAtlas(); return; }
    var W = canvas.width, H = canvas.height;
    var t0 = S.nowMs();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#0e1013';
    ctx.fillRect(0, 0, W, H);
    if (zoomPath(s.view.zoom) === 'thumb') drawThumbPath(W, H); else S.drawLayerPath(W, H);
    if (s.grid) drawGrid(W, H);
    drawOverlay(W, H);
    stat.renders++;
    stat.lastRenderMs = S.nowMs() - t0;
    stat2.cellsHits = S.cellCache ? S.cellCache.stats().hits : 0;        // ★ ③ 的记账随 render 同步一份(状态栏/自检读 stats(),不必自己去问 ③)
    stat2.cellsMisses = S.cellCache ? S.cellCache.stats().misses : 0;
    stat2.cellsSize = S.cellCache ? S.cellCache.stats().size : 0;
  }

  // ★ 尺寸变化只有一个机制(ResizeObserver 与 window.resize 同时挂 = 每次 resize 建两遍)
  function resize() {
    var wrap = canvas.parentElement;
    var w = Math.max(1, wrap ? wrap.clientWidth : canvas.width);
    var h = Math.max(1, wrap ? wrap.clientHeight : canvas.height);
    if (canvas.width === w && canvas.height === h) return;
    canvas.width = w; canvas.height = h;
    ctx.imageSmoothingEnabled = false;            // ★ 改尺寸会重置 ctx 状态,必须重设
    // ★★ 离屏层的像素是按旧画布尺寸铺的 ⇒ 尺寸一改整片失效,旧画布必须丢掉:留着的话 drawLayerPath 会把它按新目标框画出去(整层错位),而"只标脏"也不行(脏矩形只补一小块、其余留白)。丢掉之后由 buildLayers 分帧重来。
    for (var L = 0; L < RenderCore.LAYER_COUNT; L++) { layerCv[L] = null; layerDirty[L] = null; }
    S.viewChanged();
    if (s.map && zoomPath(s.view.zoom) === 'layers') return S.observed('resize', S.buildLayers().then(render));
    render();
  }

  function fit() {
    if (!s.map) return;
    s.view.zoom = fitZoom(s.map.subCols, s.map.subRows, canvas.width, canvas.height, 24);
    s.view.x = -(canvas.width / s.view.zoom - s.map.subCols) / 2;
    s.view.y = -(canvas.height / s.view.zoom - s.map.subRows) / 2;
    S.viewChanged();                             // ★ 适配改的是 zoom ⇒ 每个子格多少像素都变了,离屏层整片失效(全屏重建,闸 2 分帧)
    if (zoomPath(s.view.zoom) === 'layers') return S.observed('fit', S.buildLayers().then(render));
    render();
  }

  S.screenToSub = screenToSub;
  S.subToScreen = subToScreen;
  S.torusList = torusList;
  S.render = render;
  S.resize = resize;
  S.fit = fit;
}
</script>
<script>
/* == render/90_install_drag.js == */
// render/90_install_drag.js —— 选区拖动簇:只记偏移的预览查询(纯读,松手才 moveRegion)与去烤(markDragDirty/repaintDrag)。

function installDrag(S) {
  var s = S.s, thumbs = S.thumbs, stat2 = S.stat2;
  function setSelDrag(sel, dx, dy) {
    s.selDrag = sel ? { sel: sel, dx: dx, dy: dy } : null;
    markDragDirty();                                // ★ 见下:偏移一变就去烤
    S.render();
  }
  function setPreview(rect) { s.preview = rect; S.render(); }
  // ★★ 三种目标格必须与"松手后 moveRegion 真正写出来的结果"逐格一致:① 源格在选区内 ⇒ 读源格(被搬过来的那部分);② 源格在外、目标在选区内 ⇒ 那是被腾空的源区 ⇒ hit:false(不画)。
  //    ③ 两边都在选区外 ⇒ 原样读它自己(没被动过的底)。★ 少了 ③ 的后果不是"少画一点":偏移一动,除选区外的整整一张图都判成腾空 ⇒ 拖动时地图整体消失、只剩一个框在飘。
  // ★★ 只有活动层读偏移(落笔 moveRegion 只搬 app.r.layer() 那一层;四层一起偏移会让另三层跟手走、松手又弹回去,代价还翻四倍);一律传 W/H 环面折算,否则接缝那一侧预览与落笔分岔。
  // ★★ 选区没了,偏移就不再生效 —— 判据里必须有 s.selection(不是只有 s.selDrag):Esc 取消选区时"左键还按着"是合法状态,而框没了就没有可搬的东西,照旧读偏移会让内容留在"被搬过去"的位置上。
  function dragSource(L, X, Y) {
    if (!s.selDrag || !s.selection || L !== s.layer) return { hit: true, X: X, Y: Y };
    var W = s.map ? s.map.subCols : 0, H = s.map ? s.map.subRows : 0;
    var sel = s.selDrag.sel, q = selectionSource(sel, s.selDrag.dx, s.selDrag.dy, X, Y, W, H);
    if (q.hit) return q;
    var vacated = inSel(sel, X, Y, W, H);
    return vacated ? { hit: false, X: X, Y: Y } : { hit: true, X: X, Y: Y };
  }

  // ★★ 去烤:② 的离屏层是烤进去的 —— 拖动中滚轮缩放(setZoomAt → viewChanged() + buildLayers())或任何整片重建,都会把 dragSource 的偏移结果画死在 ② 上,而 buildLayers 结尾还把 layersClean 抬成 true。
  //    此后用户拖到第二个偏移、松手 ⇒ 提交只按最终偏移结算(源 ∪ 目标)⇒ 在更早的偏移上被烤过、而最终偏移没碰到的那些格永远留着别人的内容(框回到正确位置 ⇒ "地图上凭空多了一块错的内容",没有报错)。
  var dragBake = null;                              // { L: 烤在哪一层, rects: [规范块] } 或 null;上一次那两块也要一起重画 —— 清除时 s.selDrag 已经没了,只有这里记得它烤在哪
  function markDragDirty() {                        // ★ 修法:偏移一变(以及清除时)把「源区 ∪ 目标区」重画一遍,烤痕的寿命就不长于这一次拖动;重画的是规范化后的两块(canonRects,与 dragSource 同一套折算)
    if (!s.map) return;
    var W = s.map.subCols, H = s.map.subRows, L = s.layer, now = [];
    var live = !!s.selDrag && !!s.selection;        // ★★ 判据与 dragSource 的早退逐字同源:选区被取消而 selDrag 还挂着时,没有任何格存着偏移内容
    if (live) {
      var sel = s.selDrag.sel;
      now = canonRects({ x: sel.x, y: sel.y, w: sel.w, h: sel.h }, W, H)
        .concat(canonRects({ x: sel.x + s.selDrag.dx, y: sel.y + s.selDrag.dy, w: sel.w, h: sel.h }, W, H));
    }
    var prev = dragBake;
    dragBake = live ? { L: L, rects: now } : null;
    // ★★ dedupRects:源块在 now 与 prev.rects 里各有一份(选区没变时必然如此)⇒ 不去重就会把它连画两遍;now 自己也要过一遍(dx=dy=0 时源与目标是同一个矩形)。
    repaintDrag(L, dedupRects((prev && prev.L === L) ? now.concat(prev.rects) : now));   // ★★ 逐块重画,不取包围盒(闸 2):跨接缝时这两块分居图的两头,包围盒是整行(甚至整幅图),而高倍 + 大选区下那是全屏 clearRect 加每层数千次 drawImage、每次 pointermove 都付,且去烤是同步路径(没有走 createSlicer)
    if (prev && prev.L !== L) repaintDrag(prev.L, prev.rects);   // ★★ 层变了:上一次那批烤在旧层上,旧层此刻读到的是"没拖过"的内容,那些像素必须擦掉
    if (!live) dragBakedThumb = false;              // ★ 这次拖动结束(松手 / 选区被取消):账结清,必须排在上面两次重画之后
  }

  var dragBakedThumb = false;                       // ★ 本次拖动是否往 ① 烤过偏移:拖动途中 invalidateAll(撤销/重做一条 kind='whole' 的差量)会走 buildThumbs,而 paintThumbRect 读的正是 dragSource ⇒ 整张缩略图被按当时的偏移烤一遍,只有换回 ① 那条路时才归位
  function repaintDrag(L, rects) {                  // 把一批规范块在当前那条路上重画:① 与 ② 是两份数据、成本形状恰好相反(低倍时 ② 那份活一个字都看不见,实测见 docs/eng/editor-render.md §8)
    if (!rects.length || !layerArray(s.map, L)) return;   // ★ 缺席层直接跳过:它一个像素都没有,不存在"偏移内容"可擦,而 flushDirty 对缺席层走的是整张画布 clearRect(拖动中每帧白付、且不计数)
    if (zoomPath(s.view.zoom) === 'layers') {
      for (var i = 0; i < rects.length; i++) S.paintLayerRect(L, rects[i]);
      stat2.layerRebuilds++;                        // ★ 与 flushDirty 记的是同一本账(该层 +1)
      if (!dragBakedThumb) return;                  // ★ 常态:① 上没有这次拖动的偏移像素
    } else {
      dragBakedThumb = true;                        // ★ 这一次拖动把偏移烤进了 ①
    }
    if (!thumbs[L]) return;                         // ① 还没建(没 setMap)⇒ 没什么可烤
    for (var j = 0; j < rects.length; j++) S.paintThumbRect(L, rects[j]);
  }

  S.setSelDrag = setSelDrag;
  S.setPreview = setPreview;
  S.dragSource = dragSource;
  S.markDragDirty = markDragDirty;
}
</script>
<script>
/* == render/92_install_edit.js == */
// render/92_install_edit.js —— 编辑/换图/视图操作簇:脏区记账、整片重建、平移与缩放。

function installEdit(S) {
  var s = S.s, canvas = S.canvas, thumbs = S.thumbs;
  var layerCv = S.layerCv, layerDirty = S.layerDirty, stat2 = S.stat2;
  function invalidateCells(L, list) {           // 编辑某几个格之后:重画它们的缩略图块(Uint32Array 的下标 → 格坐标)
    if (!s.map) return null;
    var rect = null;
    for (var i = 0; i < list.length; i++) {
      var r = { x: list[i].cx * SUB, y: list[i].cy * SUB, w: SUB, h: SUB };
      rect = rectUnion(rect, r);
    }
    if (!rect) return null;
    if (thumbs[L]) S.paintThumbRect(L, rect);
    return rect;
  }
  function invalidateAll() {
    if (!s.map) return Promise.resolve();

    S.ensureThumbs(s.map);

    attachCells(S.cellCache);
    for (var L = 0; L < RenderCore.LAYER_COUNT; L++) { layerCv[L] = null; layerDirty[L] = null; }   // ★ ② 同理:旧离屏层画的是上一张图,连尺寸都可能不同 ⇒ 丢掉重来

      s.view.zoom = fitZoom(map.subCols, map.subRows, canvas.width, canvas.height, 24);
      s.view.x = -(canvas.width / s.view.zoom - map.subCols) / 2;
      s.view.y = -(canvas.height / s.view.zoom - map.subRows) / 2;

    if (Math.abs(dxPx) >= W || Math.abs(dyPx) >= H) { S.viewChanged(); return S.observed('panBy', S.buildLayers().then(S.render)); }   // ★ 位移大到整块都被换掉时,自拷贝已经没有意义
    var strips = panStrips(W, H, dxPx, dyPx);
    for (var L = 0; L < RenderCore.LAYER_COUNT; L++) {
      var cv = layerCv[L];
      if (!cv || cv.width !== W || cv.height !== H) continue;
      var c = cv.getContext('2d');
      c.globalCompositeOperation = 'copy';

      c.globalCompositeOperation = 'source-over';
      for (var i = 0; i < strips.length; i++) {
        var st = strips[i];
        var wx = s.view.x + st.x / s.view.zoom, wy = s.view.y + st.y / s.view.zoom;   // 边条对应的世界矩形:像素 → 子格(补画按新视图换算,与搬移后的像素对齐)
        S.paintLayerRect(L, { x: wx, y: wy, w: st.w / s.view.zoom, h: st.h / s.view.zoom });
      }
    }
    stat2.panCopies++;
    S.render();
  }

  // ★ 以光标为锚缩放(滚轮):缩放改变的是"每个子格多少像素" ⇒ 离屏层所有内容失效,只能整片重建(闸 2 分帧 —— 大图上是"慢慢画出来",不是"页面死掉")。
  function setZoomAt(px, py, factor) {

    s.view.x = v.x; s.view.y = v.y; s.view.zoom = v.zoom;
    S.viewChanged();
    if (!s.map || zoomPath(s.view.zoom) !== 'layers') { S.render(); return Promise.resolve(); }
    return S.observed('setZoomAt', S.buildLayers().then(S.render));
  }

  S.invalidateCells = invalidateCells;
  S.invalidateAll = invalidateAll;
  S.syncAtlas = syncAtlas;
  S.setMap = setMap;
  S.editCells = editCells;
  S.panBy = panBy;
  S.setZoomAt = setZoomAt;
}
</script>

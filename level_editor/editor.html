<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cyancular Ruins — 关卡编辑器</title>
<style>
:root { --bg:#17191d; --panel:#1f2329; --panel2:#262b32; --border:#343b45;
        --text:#d7dde5; --dim:#8b94a1; --accent:#54a0ff; --warn:#e0b34a; --danger:#e06a5a; }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--text); font-size:13px;
       font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
       display:flex; flex-direction:column; overflow:hidden; }
button { background:var(--panel2); color:var(--text); border:1px solid var(--border);
         border-radius:4px; padding:5px 9px; font-size:13px; cursor:pointer; }
button:hover:not(:disabled) { border-color:var(--accent); }
button.on { border-color:var(--accent); background:#243040; }
button:disabled { opacity:.45; cursor:default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
input[type=number], input[type=text] { background:var(--panel2); color:var(--text);
                     border:1px solid var(--border); border-radius:4px; padding:3px 6px; }
input[type=number] { width:62px; }
select { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:3px; }
#toolbar { display:flex; align-items:center; gap:5px 10px; padding:6px 8px;
           background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
#toolbar .group { display:flex; align-items:center; gap:4px; }
#toolbar .group + .group { padding-left:8px; border-left:1px solid var(--border); }
#toolbar button { padding:4px 7px; }
#mid { flex:1; display:flex; min-height:0; }
#lib { flex:0 0 210px; background:var(--panel); border-right:1px solid var(--border);
       display:flex; flex-direction:column; }
#lib h2 { font-size:13px; margin:8px 10px 4px; color:var(--accent); }
#lib-list { list-style:none; margin:0; padding:4px 6px; overflow:auto; flex:1; color:var(--dim); }
#lib-list .lib-row { display:block; width:100%; border:0; background:none; text-align:left;
                     overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
#lib-list .lib-row:hover, #lib-list .lib-row.cur { background:var(--panel2); color:var(--accent); }
#lib-btns { display:flex; flex-wrap:wrap; gap:4px; padding:5px 8px; }
#lib-backend { padding:5px 10px; color:var(--dim); overflow-wrap:anywhere; border-bottom:1px solid var(--border); }
#canvas-wrap { flex:1; min-width:0; position:relative; background:#0e1013; }
#map-canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
#empty-hint { position:absolute; inset:0; display:grid; place-content:center; padding:18px;
              text-align:center; color:var(--dim); line-height:1.9; pointer-events:none; }
#empty-hint strong { color:var(--text); font-size:15px; }
#right { flex:0 0 250px; background:var(--panel); border-left:1px solid var(--border);
         overflow:auto; }
#right h2 { font-size:13px; margin:8px 10px 4px; color:var(--accent); }
#tools { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; padding:3px 10px 6px; }
#tools button { padding:5px 0; font-size:12px; }
#selection-actions { flex-wrap:wrap; }
#selection-actions button { padding:3px 6px; font-size:12px; }
.layer-row { display:flex; align-items:center; gap:6px; padding:3px 10px; cursor:pointer; }
.layer-row .name { flex:1; }
.layer-row.cur { background:var(--panel2); color:var(--accent); }
.layer-row.absent .name::after { content:" · 缺席"; color:var(--dim); font-size:11px; }
.layer-row button { padding:2px 6px; font-size:12px; }
#palette { display:flex; flex-wrap:wrap; gap:4px; padding:4px 10px; }
#palette .sw { width:34px; height:34px; border:1px solid var(--border); padding:0;
               image-rendering:pixelated; color:#fff; font-size:10px; text-shadow:0 1px 2px #000, 0 0 3px #000; }
#palette .sw.on { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
.desc-row { display:flex; align-items:center; gap:6px; padding:2px 10px; color:var(--dim); }
.desc-row select { flex:1; }
#statusbar { display:flex; gap:14px; align-items:center; padding:4px 10px;
             background:var(--panel); border-top:1px solid var(--border); color:var(--dim); flex-wrap:wrap; }
#status-msg { color:var(--warn); }
#boot-error { background:#3a2320; color:#ffd9d0; padding:8px 12px; border-bottom:1px solid var(--danger); }
[hidden] { display:none !important; }
dialog { width:min(420px,calc(100vw - 32px)); color:var(--text); background:var(--panel);
         border:1px solid var(--border); border-radius:6px; padding:16px; }
dialog::backdrop { background:#0009; }
dialog h2 { margin:0 0 12px; font-size:16px; }
dialog label, dialog fieldset { display:flex; align-items:center; gap:8px; margin:8px 0; }
dialog input[type=text] { flex:1; min-width:0; }
dialog fieldset { border:0; padding:0; }
dialog menu { display:flex; justify-content:flex-end; gap:6px; margin:12px 0 0; padding:0; }
#report-text { margin:0; max-height:55vh; overflow:auto; white-space:pre-wrap; font:inherit; }
@media (max-width:880px) {
  #lib { flex-basis:152px; }
  #right { flex-basis:212px; }
}
</style>
</head>
<body>
<div id="boot-error" hidden></div>

<div id="toolbar">
  <div class="group" aria-label="文件">
    <button id="btn-new">新建</button>
    <button id="btn-open-file">打开文件…</button>
    <button id="btn-open-folder">打开目录…</button>
    <input id="map-file" type="file" accept=".cyrm,.txt" hidden>
    <button id="btn-save" data-document title="Ctrl+S">保存</button>
    <button id="btn-save-as" data-document title="Ctrl+Shift+S">另存为…</button>
    <button id="btn-export" data-document title="下载 CYRM v4 文件">导出</button>
  </div>
  <div class="group" aria-label="编辑">
    <button data-command="undo" data-document title="Ctrl+Z">撤销</button>
    <button data-command="redo" data-document title="Ctrl+Shift+Z / Ctrl+Y">重做</button>
  </div>
  <div class="group" aria-label="视图">
    <button id="tg-grid" class="on">网格</button>
    <button id="tg-subgrid" title="在混合材质的格内显示 16px 子格线">子格</button>
    <button id="tg-torus" class="on" title="预览当前图与右、下、右下相邻副本">环面</button>
    <button id="tg-guides" title="地图中线与两侧 3×3 分布标线 (R)">标线</button>
    <button id="btn-fit" data-document>适配</button>
  </div>
  <div class="group" aria-label="画布">
    <input id="size-w" type="number" min="1" max="400" step="1" value="125" aria-label="画布宽度">
    <span>×</span>
    <input id="size-h" type="number" min="1" max="300" step="1" value="75" aria-label="画布高度">
    <button id="btn-resize" data-document title="缩小时移除越界点位">应用尺寸</button>
    <label title="Deflate 压缩"><input id="opt-compress" type="checkbox" checked>压缩</label>
  </div>
  <div class="group" aria-label="检查">
    <button id="btn-check" data-document>校验</button>
    <button id="btn-selftest">自检</button>
  </div>
</div>

<div id="mid">
  <div id="lib">
    <h2>地图库</h2>
    <div id="lib-btns">
      <button id="btn-dup" data-document>复制</button>
      <button id="btn-rename">重命名…</button>
      <button id="btn-del">删除</button>
      <button id="btn-server" hidden>服务器库</button>
    </div>
    <div id="lib-backend"></div>
    <ul id="lib-list"></ul>
  </div>
  <div id="canvas-wrap">
    <canvas id="map-canvas"></canvas>
    <div id="empty-hint"><strong>还没有打开地图</strong><span>从地图库选择地图，或使用顶栏新建、打开文件或目录。</span></div>
  </div>
  <div id="right">
    <h2>工具</h2>
    <div id="tools">
      <button class="tool" data-tool="brush" title="B">画笔</button>
      <button class="tool" data-tool="rect">矩形</button>
      <button class="tool" data-tool="bucket" title="G">油漆桶</button>
      <button class="tool" data-tool="eraser" title="E">橡皮</button>
      <button class="tool" data-tool="line" title="L">直线</button>
      <button class="tool" data-tool="select" title="M">选框</button>
      <button class="tool" data-tool="picker" title="I">吸管</button>
      <button class="tool" data-tool="gradient" title="背景渐变">渐变</button>
    </div>
    <label class="desc-row">画笔 <input id="brush-size" type="number" min="0.25" max="15" step="0.25" value="1"></label>
    <label class="desc-row" data-tool-options="rect">矩形
      <select id="rect-mode"><option value="fill">填充</option><option value="outline">描边</option></select>
    </label>
    <label class="desc-row" data-tool-options="line">直线宽度
      <select id="line-width"><option value="1">1 子格</option><option value="2">2 子格</option><option value="4">1 格</option></select>
    </label>
    <div class="desc-row" id="selection-actions" data-tool-options="select">
      <button data-command="copy" data-document>复制</button><button data-command="cut" data-document>剪切</button>
      <button data-command="paste" data-document>粘贴</button><button data-command="clear-selection" data-document>清除</button>
      <button data-command="mirror:h" data-document>水平镜像</button><button data-command="mirror:v" data-document>垂直镜像</button>
    </div>
    <h2>图层</h2>
    <div id="layers">
      <div class="layer-row" data-layer="0"><span class="name">前景</span><button class="vis" title="显示/隐藏">👁</button><button class="lock" title="锁定">🔒</button></div>
      <div class="layer-row cur" data-layer="1"><span class="name">场景</span><button class="vis" title="显示/隐藏">👁</button><button class="lock" title="锁定">🔒</button></div>
      <div class="layer-row" data-layer="2"><span class="name">后景</span><button class="vis" title="显示/隐藏">👁</button><button class="lock" title="锁定">🔒</button></div>
      <div class="layer-row" data-layer="3"><span class="name">背景</span><button class="vis" title="显示/隐藏">👁</button><button class="lock" title="锁定">🔒</button></div>
    </div>
    <div class="desc-row"><label><input id="dim-others" type="checkbox" checked> 非当前层压暗 60%</label></div>
    <h2>纹理调色板</h2>
    <div id="palette"></div>
    <h2>辅码</h2>
    <div class="desc-row"><span>色相</span><select id="desc-hue"></select></div>
    <div class="desc-row"><span>亮度</span><select id="desc-bri"></select></div>
    <div class="desc-row"><span>饱和</span><select id="desc-sat"></select></div>
    <div class="desc-row"><span>透明</span><select id="desc-alp"></select></div>
    <div class="desc-row"><label><input id="desc-only" type="checkbox"> 只改辅码(不碰纹理)</label></div>
    <h2 id="bg-color-title">颜色(背景层)</h2>
    <div class="desc-row" id="bg-color-row">
      <span>起点</span>
      <input id="bg-color" type="color" value="#00ffff">
      <span id="bg-color-val">#00ffff</span>
    </div>
    <div class="desc-row" id="bg-color-row2">
      <span>终点</span>
      <input id="bg-color2" type="color" value="#101820">
      <span id="bg-color2-val">#101820</span>
    </div>
    <h2>出生点工具</h2>
    <label class="desc-row">敌人类型 <select id="spawn-enemy-type"></select></label>
    <div class="desc-row">
      <button id="spawn-p1">放 P1</button>
      <button id="spawn-p2">放 P2</button>
      <button id="spawn-enemy">放敌人</button>
    </div>
    <div class="desc-row"><button id="spawn-clear">清空出生点</button></div>
    <h2>团队复活点</h2>
    <div class="desc-row" id="respawn-count" aria-live="polite" title="团队赛每侧至少需要 5 个合法复活点">侧 1 0 · 侧 2 0</div>
    <div class="desc-row">
      <button class="tool" data-tool="respawn-1" title="点击画布放置，再点同侧复活点删除">放侧 1</button>
      <button data-clear-respawn="1">清空侧 1</button>
    </div>
    <div class="desc-row">
      <button class="tool" data-tool="respawn-2" title="点击画布放置，再点同侧复活点删除">放侧 2</button>
      <button data-clear-respawn="2">清空侧 2</button>
    </div>
  </div>
</div>

<div id="statusbar">
  <span id="st-name">(未打开)</span>
  <span id="st-size"></span>
  <span id="st-tool"></span>
  <span id="st-tex"></span>
  <span id="st-desc"></span>
  <span id="st-sel"></span>
  <span id="st-undo"></span>
  <span id="st-valid"></span>
  <span id="st-save">未保存</span>
  <span id="status-msg">就绪</span>
</div>

<dialog id="file-dialog" aria-labelledby="file-dialog-title">
  <form method="dialog">
    <h2 id="file-dialog-title"></h2>
    <label>文件名 <input id="file-stem" type="text" maxlength="64" pattern="[A-Za-z0-9_\-]{1,64}" required> .cyrm</label>
    <fieldset id="new-size">
      <label>宽 <input id="new-width" type="number" min="1" max="400" required></label>
      <label>高 <input id="new-height" type="number" min="1" max="300" required></label>
    </fieldset>
    <menu><button value="ok">确定</button><button id="cancel-file-dialog" type="button">取消</button></menu>
  </form>
</dialog>
<dialog id="report-dialog" aria-labelledby="report-title">
  <h2 id="report-title"></h2><pre id="report-text"></pre>
  <form method="dialog"><menu><button>关闭</button></menu></form>
</dialog>

<script>

    "name": "JumpBird",
    "scene": "res://scenes/enemies/enemy_jump_bird.tscn",

  },
  {
    "id": "fly_bird",
    "name": "FlyBird",
    "scene": "res://scenes/enemies/enemy_fly_bird.tscn",
    "color": "#c96fb0"
  },
  {
    "id": "black_bird",
    "name": "BlackBird",
    "scene": "res://scenes/enemies/enemy_black_bird.tscn",
    "color": "#8a8f98"
  }
];

<script src="tile_defs.js"></script>
<script src="core.js"></script>
<script src="tint.js"></script>
<script src="render.js"></script>
<script src="io.js"></script>
<script src="map_files.js"></script>
<script src="ui.js"></script>
<script>
'use strict';
// 页面仅负责挂载 DOM 并移交给 ui.js 处理
document.addEventListener('DOMContentLoaded', function () { Editor.boot(); });
</script>
</body>
</html>

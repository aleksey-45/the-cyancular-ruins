name: Build game

on:
  push:
    branches:
      - "siri"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-2025
          - platform: macOS
            runner: macos-15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Install native build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Build and package game
        env:
          GODOT_EDITOR: ${{ env.GODOT4 }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/build_game.py
      - name: Check core behavior
        env:
          GODOT_EDITOR: ${{ env.GODOT4 }}
        run: python tools/run_checks.py

      - uses: actions/upload-artifact@v7
        with:
          path: builds/The-Cyancular-Ruins-${{ matrix.platform }}.zip
          archive: false
          if-no-files-found: error

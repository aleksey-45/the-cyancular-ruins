name: Build and test

on:
  push:
    branches:
      - "feat/upstream-main-migration"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build native extensions
        shell: pwsh
        run: |
          if ($IsWindows) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            & (Join-Path $install 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          }
          python tools/build_native.py

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - name: Import project
        shell: bash
        run: '"$GODOT4" --headless --import'
      - name: Check core behavior
        run: python tools/run_checks.py
      - name: Build and package game
        env:
          GODOT_EDITOR: ${{ env.GODOT4 }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/build_game.py --skip-native
      - name: Smoke test extracted game
        run: python tools/check_package.py builds/The-Cyancular-Ruins-${{ runner.os }}.zip
      - name: Upload verified game ZIP
        uses: actions/upload-artifact@v7
        with:
          path: builds/The-Cyancular-Ruins-${{ runner.os }}.zip
          archive: false
          if-no-files-found: error
          overwrite: true

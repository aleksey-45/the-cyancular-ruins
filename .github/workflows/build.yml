name: Build game

on:
  push:
    branches:
      - "siri_v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install native build tools
        shell: pwsh
        run: |
          python -m pip install scons==4.9.1 cmake==3.31.6 ninja==1.11.1.4

      - name: Install official EasyTier nightly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python tools/fetch_easytier.py --platform windows
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build, export and package game
        shell: pwsh
        run: |
          $env:GODOT_EDITOR = $env:GODOT4
          python tools/build_release.py
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload game package
        uses: actions/upload-artifact@v4
        with:
          name: The-Cyancular-Ruins-Windows
          path: builds/
          if-no-files-found: error
          compression-level: 1

  build_macos:
    name: Build macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - name: Build and package universal app
        env:
          GODOT_EDITOR: ${{ env.GODOT4 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install scons==4.9.1 cmake==3.31.6 ninja==1.11.1.4
          python tools/build_macos.py

      - uses: actions/upload-artifact@v4
        with:
          name: The-Cyancular-Ruins-macOS
          path: builds/macos/The-Cyancular-Ruins.zip
          if-no-files-found: error
          compression-level: 0

  test_macos:
    name: Test macOS (${{ matrix.runner }})
    needs: build_macos
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - uses: actions/download-artifact@v4
        with:
          name: The-Cyancular-Ruins-macOS
          path: .test_logs/download

      - name: Verify package and process lifecycle
        run: python tests/network/run_macos.py --godot "$GODOT4" --archive .test_logs/download/The-Cyancular-Ruins.zip

      - name: Show validation failure logs
        if: failure()
        run: find .test_logs -type f -name '*.log' -exec tail -n 80 {} +

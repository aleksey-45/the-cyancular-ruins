name: Build and test

on:
  push:
    branches:
      - "siri"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native_windows:
    name: Build native extensions (Windows)
    runs-on: &windows windows-2025
    timeout-minutes: 45

    steps: &native_steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Install native build tools
        run: python -m pip install cmake==3.31.6 ninja==1.11.1.4
      - name: Build native extensions
        run: python tools/build_native.py
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ runner.os }}
          path: native/*/bin/*
          if-no-files-found: error
          overwrite: true

  native_macos:
    name: Build native extensions (macOS)
    runs-on: &macos macos-15
    timeout-minutes: 45
    steps: *native_steps

  build_windows:
    name: Build Windows
    needs: native_windows
    runs-on: *windows
    timeout-minutes: 45

    steps: &build_steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - uses: actions/download-artifact@v8
        with:
          name: native-${{ runner.os }}
          path: native
      - name: Build and package game
        env:
          GODOT_EDITOR: ${{ env.GODOT4 }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/build_game.py --skip-native

      - uses: actions/upload-artifact@v7
        with:
          path: builds/The-Cyancular-Ruins-${{ runner.os }}.zip
          archive: false
          if-no-files-found: error

  build_macos:
    name: Build macOS
    needs: native_macos
    runs-on: *macos
    timeout-minutes: 45
    steps: *build_steps

  test_windows:
    name: Test Windows
    needs: native_windows
    runs-on: *windows
    timeout-minutes: 45

    steps: &test_steps
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.1
          use-dotnet: false
      - uses: actions/download-artifact@v8
        with:
          name: native-${{ runner.os }}
          path: native
      - name: Import project
        shell: bash
        run: '"$GODOT4" --headless --editor --import'
      - name: Check core behavior
        env:
          GODOT_EDITOR: ${{ env.GODOT4 }}
        run: python tools/run_checks.py

  test_macos:
    name: Test macOS
    needs: native_macos
    runs-on: *macos
    timeout-minutes: 45
    steps: *test_steps
